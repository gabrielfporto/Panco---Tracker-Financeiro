}

function viewInvestimentos() {
  const de = (t) => state.investimentos.filter(i => i.tipo === t);
  const reserva = de('Reserva de Emergência'), bens = de('Bens de Patrimônio'), dividas = de('Dívidas');
  const invest = state.investimentos.filter(i => !['Reserva de Emergência', 'Bens de Patrimônio', 'Dívidas'].includes(i.tipo));
  const liquidez = state.saldoAtualTotal + somaInv(reserva);
  const vB = somaInv(bens), vI = somaInv(invest), vD = somaInv(dividas);
  const total = liquidez + vB + vI - vD;
  const partes = [{ n: 'Liquidez', v: liquidez, c: 'var(--color-primary)' }, { n: 'Bens', v: vB, c: '#3B6FD4' }, { n: 'Investimentos', v: vI, c: '#7B3FC4' }].filter(p => p.v > 0);
  const soma = partes.reduce((s, x) => s + x.v, 0) || 1;
  let acc = 0;
  const grad = partes.length ? partes.map(p => { const ini = acc; acc += p.v / soma * 100; return `${p.c} ${ini}% ${acc}%`; }).join(',') : '#E2E7E1 0% 100%';

  const kpi = (rot, val, cor, ico) => `<div class="bg-white rounded-2xl p-4 card"><div class="flex items-center gap-2 mb-2"><span class="w-7 h-7 rounded-lg grid place-items-center text-xs" style="background:${cor}18;color:${cor}">${ico}</span><span class="text-[11px] font-semibold tracking-wide text-aura-muted">${rot}</span></div><p class="text-lg font-extrabold break-words" style="color:${cor}">${fmt(val)}</p></div>`;
  const grupo = (titulo, tipo, arr, cor, vazio) => `
    <div class="bg-white rounded-2xl p-5 card">
      <div class="flex items-center justify-between mb-2">
        <p class="font-bold text-sm tracking-wide" style="color:${cor}">${titulo}</p>
        <button data-add-invest="${tipo}" class="text-xs text-aura-muted font-semibold">+ Adicionar</button>
      </div>
      ${arr.length ? arr.map(linhaInv).join('') : `<p class="text-sm text-aura-muted py-4 text-center">${vazio}</p>`}
    </div>`;

  return `
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-5">
      <div class="col-span-2 md:col-span-1 rounded-2xl p-5 text-white card" style="background:linear-gradient(135deg,var(--color-primarydark),var(--color-primary))">
        <p class="text-[11px] tracking-wide text-white/80 mb-2">PATRIMÔNIO TOTAL</p>
        <p class="text-xl font-extrabold break-words">${fmt(total)}</p>
      </div>
      ${kpi('LIQUIDEZ', liquidez, 'var(--color-primary)', '$')}
      ${kpi('BENS', vB, '#3B6FD4', '⌂')}
      ${kpi('INVESTIMENTOS', vI, '#3A3A8F', '↗')}
      ${kpi('DÍVIDAS', vD, '#C1442C', '▤')}
    </div>
    <div class="lg:grid lg:grid-cols-3 lg:gap-5 space-y-5 lg:space-y-0 items-start">
      <div class="bg-white rounded-2xl p-5 card">
        <p class="font-bold mb-4">Composição do patrimônio</p>
        <div class="flex flex-col items-center gap-4">
          <div class="donut" style="background:conic-gradient(${grad})"></div>
          <div class="w-full space-y-2">
            ${partes.map(p => `<div class="flex justify-between text-sm"><span><span style="color:${p.c}">●</span> ${p.n}</span><span class="font-medium">${fmt(p.v)}</span></div>`).join('') || '<p class="text-xs text-aura-muted text-center">Sem dados ainda.</p>'}
          </div>
        </div>
      </div>
      <div class="space-y-5">
        <div class="bg-white rounded-2xl p-5 card">
          <p class="font-bold text-sm tracking-wide mb-2" style="color:var(--color-primary)">LIQUIDEZ</p>
          <div class="flex justify-between py-2 text-sm"><span>Saldo em conta</span><span class="font-semibold">${fmt(state.saldoAtualTotal)}</span></div>
          <div class="flex justify-between py-2 text-sm border-t border-aura-line"><span>Reserva de emergência</span><span class="font-semibold">${fmt(somaInv(reserva))}</span></div>
        </div>
        ${grupo('DÍVIDAS', 'Dívidas', dividas, '#C1442C', 'Nenhuma dívida cadastrada.')}
      </div>
      <div class="space-y-5">
        ${grupo('BENS', 'Bens de Patrimônio', bens, '#3B6FD4', 'Nenhum bem cadastrado (imóveis, veículos…).')}
        ${grupo('INVESTIMENTOS', 'Renda Fixa', invest, '#3A3A8F', 'Nenhum investimento cadastrado.')}
      </div>
    </div>`;
}

function abrirModalInvest(id = null, tipoFixo = null) {
  const e = id ? state.investimentos.find(i => i.id === id) : null;
  const tipo = e?.tipo || tipoFixo || 'Renda Fixa';
  const travado = !!tipoFixo && !e;
  const debitoPadrao = (t) => t === 'Renda Fixa' || t === 'Renda Variável' || t === 'Reserva de Emergência';

  abrirModal({
    titulo: e ? 'Editar ativo' : 'Novo ativo',
    sub: tipo === 'Reserva de Emergência' ? 'Onde está guardada a sua reserva.' : 'Registre um bem ou investimento.',
    ok: e ? 'Salvar' : 'Adicionar',
    corpo: `
      <div><label class="lbl">Nome</label><input id="i-ativo" class="inp" placeholder="Ex.: Tesouro Selic, Apartamento…" value="${esc(e?.ativo || '')}" /></div>
      <div><label class="lbl">Tipo</label>
        <select id="i-tipo" class="inp" ${travado ? 'disabled' : ''}>
          ${TIPOS_RESERVA.map(t => `<option value="${t}" ${t === tipo ? 'selected' : ''}>${t}</option>`).join('')}
        </select></div>
      <div><label class="lbl">Valor aplicado</label><div class="field-money"><span>R$</span><input id="i-valor-aplicado" type="number" step="0.01" inputmode="decimal" placeholder="0,00" value="${e?.valor_aplicado ?? ''}" /></div></div>
      <div><label class="lbl">Valor atual (opcional)</label><div class="field-money"><span>R$</span><input id="i-valor-atual" type="number" step="0.01" inputmode="decimal" placeholder="padrão: valor aplicado" value="${e?.valor_atual ?? ''}" /></div></div>
      <div><label class="lbl">Data</label><input id="i-data" type="date" class="inp" value="${e?.data_aplicacao || ''}" /></div>
      <div id="i-bloco-debito" class="${tipo === 'Dívidas' ? 'hidden' : ''}">
        <label class="flex items-start gap-2 text-sm">
          <input id="i-debitar" type="checkbox" class="w-4 h-4 mt-0.5" ${debitoPadrao(tipo) ? 'checked' : ''} />
          <span>${e ? 'Debitar da conta o valor do aporte adicional (se o valor aplicado aumentar)' : 'Debitar esse valor da conta bancária agora'}</span>
        </label>
      </div>`,
    onOpen: () => {
      document.getElementById('i-tipo')?.addEventListener('change', (ev) => {
        const t = ev.target.value;
        document.getElementById('i-bloco-debito')?.classList.toggle('hidden', t === 'Dívidas');
        const chk = document.getElementById('i-debitar');
        if (chk && !e) chk.checked = debitoPadrao(t);
      });
    },
    onOk: async () => {
      const ativo = document.getElementById('i-ativo').value.trim();
      const valorAplicado = parseFloat(document.getElementById('i-valor-aplicado').value);
      const atualStr = document.getElementById('i-valor-atual').value;
      const tipoEscolhido = document.getElementById('i-tipo').value || null;
      const debitar = document.getElementById('i-debitar')?.checked && tipoEscolhido !== 'Dívidas';
      if (!ativo || !valorAplicado || valorAplicado <= 0) return erroModal('Informe o nome e um valor aplicado válido.');
      const payload = {
        ativo,
        tipo: tipoEscolhido,
        valor_aplicado: valorAplicado,
        valor_atual: atualStr ? parseFloat(atualStr) : valorAplicado,
        data_aplicacao: document.getElementById('i-data').value || null,
      };

      const valorAplicadoAnterior = Number(e?.valor_aplicado || 0);
      const { error } = e
        ? await sb.from('investimentos').update(payload).eq('id', e.id)
        : await sb.from('investimentos').insert({ user_id: state.user.id, ...payload });
      if (error) return erroModal(error.message);

      if (debitar) {
        const valorDebito = e ? (valorAplicado - valorAplicadoAnterior) : valorAplicado;
        if (valorDebito > 0) {
          await sb.from('transacoes').insert({
            user_id: state.user.id,
            descricao: `${e ? 'Aporte adicional' : 'Aporte'}: ${ativo}`,
            valor: valorDebito,
            tipo: 'saida',
            data: e ? isoLocal(new Date()) : (payload.data_aplicacao || isoLocal(new Date())),
            metodo_pagamento: 'Pix',
          });
        }
      }

      fecharModal();
      await loadAll(true);
      renderApp();
    },
  });
}

function viewPlanejamento() {
  const gastoPorCategoria = {};
  state.transacoes.filter(t => t.tipo === 'saida').forEach(t => {
    const key = t.categoria_id || 'sem-categoria';
    gastoPorCategoria[key] = (gastoPorCategoria[key] || 0) + Number(t.valor);
  });

  const recebidoPorCategoria = {};
  state.transacoes.filter(t => t.tipo === 'entrada').forEach(t => {
    const key = t.categoria_id || 'sem-categoria';
    recebidoPorCategoria[key] = (recebidoPorCategoria[key] || 0) + Number(t.valor);
  });

  const limitePorCategoria = {};
  state.orcamentos.forEach(o => { limitePorCategoria[o.categoria_id] = Number(o.valor_limite); });

  const categoriasSaida = state.categorias.filter(c => c.tipo === 'saida');
  const categoriasEntrada = state.categorias.filter(c => c.tipo === 'entrada');

  const totalGasto = Object.values(gastoPorCategoria).reduce((s, v) => s + v, 0);
  const totalOrcado = state.orcamentos
    .filter(o => state.categorias.find(c => c.id === o.categoria_id)?.tipo === 'saida')
    .reduce((s, o) => s + Number(o.valor_limite), 0);

  const totalRecebido = Object.values(recebidoPorCategoria).reduce((s, v) => s + v, 0);
  const totalEsperado = state.orcamentos
    .filter(o => state.categorias.find(c => c.id === o.categoria_id)?.tipo === 'entrada')
    .reduce((s, o) => s + Number(o.valor_limite), 0);

  const linhaCategoria = (c, gasto, tipo) => {
    const limite = limitePorCategoria[c.id];
    const pct = limite ? Math.min(100, Math.round((gasto / limite) * 100)) : 0;
    const estourou = tipo === 'saida' && limite && gasto > limite;
    const corBarra = estourou ? 'bg-aura-danger' : 'bg-aura-primary';
    const rotulo = tipo === 'entrada' ? 'Recebido' : 'Gasto';
    return `
      <div class="bg-white rounded-xl p-4 card">
        <div class="flex items-center justify-between mb-2">
          <p class="font-medium text-sm">${esc(c.nome)}</p>
          <div class="flex items-center gap-2">
            <button data-def-orcamento="${c.id}" class="text-xs text-aura-primary font-semibold">${limite ? 'Editar' : '+ Definir'}</button>
            <button data-del-categoria="${c.id}" class="text-aura-muted text-xs">✕</button>
          </div>
        </div>
        ${limite ? `
          <div class="w-full bg-aura-tint rounded-full h-2 mb-2">
            <div class="${corBarra} h-2 rounded-full" style="width:${pct}%"></div>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-x-3 text-xs text-aura-muted">
            <span>${fmt(gasto)} de ${fmt(limite)}</span>
            <span class="${estourou ? 'text-aura-danger font-semibold' : ''}">${pct}%${estourou ? ' · estourou' : ''}</span>
          </div>
        ` : `
          <p class="text-xs text-aura-muted">${rotulo} no mês: ${fmt(gasto)} · sem orçamento definido</p>
        `}
      </div>
    `;
  };

  return `
    <div class="">
      <div class="flex items-center justify-between mb-1">
        <button data-toggle="form-categoria" class="text-sm text-white bg-aura-primary rounded-full px-4 py-2 font-semibold">+ Categoria</button>
      </div>
      <p class="text-aura-muted text-sm mb-4">Defina um orçamento mensal por categoria e acompanhe entradas e saídas</p>

      ${seletorMes()}

      <div id="form-categoria" class="hidden mb-6 bg-white rounded-xl p-4 card space-y-3 md:max-w-md">
        <p class="text-sm font-semibold">Nova categoria</p>
        <input id="cat-nome" placeholder="Nome da categoria"
          class="w-full rounded-xl border border-aura-line px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary" />
        <select id="cat-tipo" class="w-full rounded-xl border border-aura-line bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary">
          <option value="saida">Saída</option>
          <option value="entrada">Entrada</option>
        </select>
        <p id="cat-erro" class="text-aura-danger text-sm hidden"></p>
        <button id="cat-salvar" class="w-full rounded-xl bg-aura-primary text-white font-semibold py-3">Salvar categoria</button>
      </div>

      <div class="rounded-2xl bg-aura-primary text-white p-5 card mb-4 md:max-w-md">
        <p class="text-xs text-white/70">GASTO TOTAL DO MÊS</p>
        <p class="text-2xl font-extrabold mb-1">${fmt(totalGasto)}</p>
        <p class="text-xs text-white/70">${totalOrcado > 0 ? 'Orçado: ' + fmt(totalOrcado) : 'Nenhuma categoria orçada ainda'}</p>
      </div>

      <h2 class="font-semibold mb-3">Despesas</h2>
      <div class="space-y-3 md:grid md:grid-cols-2 md:gap-3 md:space-y-0 mb-8">
        ${categoriasSaida.length === 0
          ? `<p class="text-aura-muted text-sm py-6 text-center md:col-span-2">Nenhuma categoria de saída cadastrada.</p>`
          : categoriasSaida.map(c => linhaCategoria(c, gastoPorCategoria[c.id] || 0, 'saida')).join('')}
      </div>

      <div class="rounded-2xl bg-aura-tint p-5 card mb-4 md:max-w-md">
        <p class="text-xs text-aura-muted">RENDA RECEBIDA NO MÊS</p>
        <p class="text-2xl font-extrabold mb-1 text-aura-green">${fmt(totalRecebido)}</p>
        <p class="text-xs text-aura-muted">${totalEsperado > 0 ? 'Esperado: ' + fmt(totalEsperado) : 'Nenhuma renda esperada definida ainda'}</p>
      </div>

      <h2 class="font-semibold mb-3">Entradas</h2>
      <div class="space-y-3 md:grid md:grid-cols-2 md:gap-3 md:space-y-0">
        ${categoriasEntrada.length === 0
          ? `<p class="text-aura-muted text-sm py-6 text-center md:col-span-2">Nenhuma categoria de entrada cadastrada.</p>`
          : categoriasEntrada.map(c => linhaCategoria(c, recebidoPorCategoria[c.id] || 0, 'entrada')).join('')}
      </div>
    </div>
  `;
}

function bindNovaTransacao(editando = null) {
    let tipoSelecionado = 'entrada';
    let metodoSelecionado = 'Pix';

    const dataInput = document.getElementById('data');
    if (dataInput) {
      dataInput.value = isoLocal(ehMesAtual() ? new Date() : state.mesRef);
    }

    const optEntrada = document.getElementById('opt-entrada');
    const optSaida = document.getElementById('opt-saida');
    const atualizarOptgroups = () => {
      if (!optEntrada || !optSaida) return;
      optEntrada.hidden = tipoSelecionado !== 'entrada';
      optSaida.hidden = tipoSelecionado !== 'saida';
    };
    atualizarOptgroups();

    document.querySelectorAll('.tipo-btn').forEach(btn => {
      btn.onclick = () => {
        tipoSelecionado = btn.dataset.tipo;
        document.querySelectorAll('.tipo-btn').forEach(b => {
          b.classList.remove('bg-aura-tint', 'text-aura-primary');
          b.classList.add('bg-white', 'text-aura-muted');
        });
        btn.classList.remove('bg-white', 'text-aura-muted');
        btn.classList.add('bg-aura-tint', 'text-aura-primary');
        document.getElementById('categoria').value = '';
        atualizarOptgroups();
      };
    });

    const blocoParcelas = document.getElementById('bloco-parcelas');
    const blocoRecorrente = document.getElementById('bloco-recorrente');
    const parcelasInput = document.getElementById('parcelas');
    const recorrenteCheckbox = document.getElementById('recorrente');
    const blocoRecorrenteMeses = document.getElementById('bloco-recorrente-meses');

    const atualizarVisibilidadeRecorrenteParcelas = () => {
      const numParcelas = parseInt(parcelasInput?.value) || 1;
      if (numParcelas > 1) {
        blocoRecorrente.classList.add('hidden');
        recorrenteCheckbox.checked = false;
        blocoRecorrenteMeses.classList.add('hidden');
      } else {
        blocoRecorrente.classList.remove('hidden');
      }
    };

    document.querySelectorAll('.metodo-btn').forEach(btn => {
      btn.onclick = () => {
        metodoSelecionado = btn.dataset.metodo;
        document.querySelectorAll('.metodo-btn').forEach(b => {
          b.classList.remove('bg-aura-tint', 'text-aura-primary');
          b.classList.add('bg-white', 'text-aura-muted');
        });
        btn.classList.remove('bg-white', 'text-aura-muted');
        btn.classList.add('bg-aura-tint', 'text-aura-primary');

        const cartaoSelect = document.getElementById('cartao-select');
        if (metodoSelecionado === 'Cartão') {
          cartaoSelect.classList.remove('hidden');
          blocoParcelas.classList.remove('hidden');
        } else {
          cartaoSelect.classList.add('hidden');
          cartaoSelect.value = '';
          blocoParcelas.classList.add('hidden');
          parcelasInput.value = 1;
        }
        atualizarVisibilidadeRecorrenteParcelas();
        document.getElementById('bloco-proxima-fatura')?.classList.toggle('hidden', metodoSelecionado !== 'Cartão');
      };
    });

    parcelasInput?.addEventListener('input', atualizarVisibilidadeRecorrenteParcelas);

    recorrenteCheckbox?.addEventListener('change', () => {
      blocoRecorrenteMeses.classList.toggle('hidden', !recorrenteCheckbox.checked);
    });

    if (editando) {
      document.querySelector(`.tipo-btn[data-tipo="${editando.tipo}"]`)?.click();
      document.querySelector(`.metodo-btn[data-metodo="${editando.metodo_pagamento || 'Pix'}"]`)?.click();
      document.getElementById('data').value = editando.data;
      document.getElementById('valor').value = editando.valor;
      document.getElementById('descricao').value = editando.descricao || '';
      document.getElementById('categoria').value = editando.categoria_id || '';
      document.getElementById('cartao-select').value = editando.cartao_id || '';
      document.getElementById('proxima-fatura').checked = !!editando.proxima_fatura;
      ['bloco-recorrente', 'bloco-parcelas'].forEach(i => { document.getElementById(i).style.display = 'none'; });
      document.getElementById('futuro')?.closest('.opt-card')?.style.setProperty('display', 'none');
    }

    document.getElementById('modal-ok')?.addEventListener('click', async () => {
      const descricao = document.getElementById('descricao').value.trim();
      const valorTotal = parseFloat(document.getElementById('valor').value);
      const data = document.getElementById('data').value;
      const categoriaId = document.getElementById('categoria').value || null;
      const cartaoId = metodoSelecionado === 'Cartão' ? (document.getElementById('cartao-select').value || null) : null;
      const numParcelas = metodoSelecionado === 'Cartão' ? (parseInt(parcelasInput.value) || 1) : 1;
      const recorrente = recorrenteCheckbox.checked && numParcelas <= 1;
      const meses = recorrente ? (parseInt(document.getElementById('repetir-meses').value) || 12) : 1;
      const proxima = metodoSelecionado === 'Cartão' && !!document.getElementById('proxima-fatura')?.checked;
      const erro = document.getElementById('modal-erro');

      if (document.getElementById('futuro')?.checked && data <= isoLocal(new Date())) {
        erro.textContent = 'Para recebimento futuro, a data precisa ser posterior a hoje.';
        erro.classList.remove('hidden');
        return;
      }
      if (!valorTotal || valorTotal <= 0 || !data) {
        erro.textContent = 'Preencha valor e data corretamente.';
        erro.classList.remove('hidden');
        return;
      }

      if (editando) {
        if (metodoSelecionado === 'Cartão' && !cartaoId) {
          erro.textContent = 'Selecione o cartão.';
          erro.classList.remove('hidden');
          return;
        }
        const comum = { tipo: tipoSelecionado, valor: valorTotal, categoria_id: categoriaId, metodo_pagamento: metodoSelecionado, cartao_id: cartaoId, proxima_fatura: proxima };
        const daSerie = editando.serie_id && document.getElementById('aplicar-serie')?.checked;
        let res;
        if (daSerie) {
          const parcelada = Number(editando.total_parcelas) > 1;
          res = await sb.from('transacoes').update(parcelada ? comum : { ...comum, descricao })
            .eq('serie_id', editando.serie_id).gte('data', editando.data);
          if (!res.error) res = await sb.from('transacoes').update({ descricao, data }).eq('id', editando.id);
        } else {
          res = await sb.from('transacoes').update({ ...comum, descricao, data }).eq('id', editando.id);
        }
        if (res.error) { erro.textContent = res.error.message; erro.classList.remove('hidden'); return; }
        fecharModal();
        await loadAll(true);
        renderApp();
        return;
      }

      const base = {
        user_id: state.user.id,
        tipo: tipoSelecionado,
        categoria_id: categoriaId,
        metodo_pagamento: metodoSelecionado,
        cartao_id: cartaoId,
        proxima_fatura: proxima,
      };

      let linhas = [];
      const serieId = (numParcelas > 1 || recorrente) ? crypto.randomUUID() : null;

      if (numParcelas > 1) {
        const valorParcela = Math.round((valorTotal / numParcelas) * 100) / 100;
        const somaParcelas = valorParcela * (numParcelas - 1);
        for (let i = 0; i < numParcelas; i++) {
          linhas.push({
            ...base,
            descricao: `${descricao || 'Compra'} (${i + 1}/${numParcelas})`,
            valor: i === numParcelas - 1 ? Math.round((valorTotal - somaParcelas) * 100) / 100 : valorParcela,
            data: addMonths(data, i),
            parcela_atual: i + 1,
            total_parcelas: numParcelas,
            serie_id: serieId,
          });
        }
      } else if (recorrente) {
        for (let i = 0; i < meses; i++) {
          linhas.push({
            ...base,
            descricao,
            valor: valorTotal,
            data: addMonths(data, i),
            serie_id: serieId,
          });
        }
      } else {
        linhas.push({ ...base, descricao, valor: valorTotal, data });
      }

      const { error } = await sb.from('transacoes').insert(linhas);

      if (error) {
        erro.textContent = error.message;
        erro.classList.remove('hidden');
        return;
      }

      fecharModal();
      await loadAll(true);
      renderApp();
    });
}

function bindViewEvents() {
  document.getElementById('btn-logout')?.addEventListener('click', async () => {
    await sb.auth.signOut();
    render();
  });

  document.querySelectorAll('[data-nav-inline]').forEach(btn => {
    btn.onclick = () => setView(btn.dataset.navInline);
  });

  document.querySelectorAll('[data-mes]').forEach(btn => {
    btn.onclick = async () => {
      const delta = parseInt(btn.dataset.mes);
      if (delta === 0) {
        state.mesRef = primeiroDiaDoMes();
      } else {
        state.mesRef = new Date(state.mesRef.getFullYear(), state.mesRef.getMonth() + delta, 1);
      }
      await loadDadosMes(); // Busca apenas as transações do novo mês
      renderApp();
    };
  });

  document.querySelectorAll('[data-subtab]').forEach(btn => {
    btn.onclick = () => { state.subtab = btn.dataset.subtab; renderApp(); };
  });

  document.querySelectorAll('[data-nova-transacao]').forEach(btn => {
    btn.onclick = () => irParaNovaTransacao(btn.dataset.tipo);
  });

  document.querySelectorAll('[data-ajustar-investir]').forEach(btn => { btn.onclick = abrirModalInvestir; });

  document.querySelectorAll('[data-ir-planejamento]').forEach(btn => {
    btn.onclick = () => { state.subtab = 'planejamento'; setView('inicio'); };
  });

  document.querySelectorAll('[data-limpar]').forEach(btn => {
    btn.onclick = async () => {
      const ids = listaDaAba(btn.dataset.limpar).map(t => t.id);
      if (!ids.length) return;
      if (!confirm(`Excluir os ${ids.length} lançamentos desta aba em ${monthName()}? Não dá para desfazer.`)) return;
      const { error } = await sb.from('transacoes').delete().in('id', ids);
      if (error) { alert(error.message); return; }
      await loadAll(true); renderApp();
    };
  });

  document.getElementById('btn-edit-nome')?.addEventListener('click', async () => {
    const novo = prompt('Como você quer ser chamado?', nomeExibicao());
    if (!novo) return;
    const { data, error } = await sb.auth.updateUser({ data: { full_name: novo } });
    if (!error && data?.user) state.user = data.user;
    renderApp();
  });

  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = () => document.getElementById(btn.dataset.toggle)?.classList.toggle('hidden');
  });

  document.querySelectorAll('[data-novo-cartao]').forEach(btn => {
    btn.onclick = () => {
      state.editandoCartaoId = null;
      document.getElementById('form-cartao')?.classList.toggle('hidden');
    };
  });

  document.querySelectorAll('[data-edit-cartao]').forEach(btn => {
    btn.onclick = () => {
      state.editandoCartaoId = btn.dataset.editCartao;
      renderApp();
    };
  });

  document.querySelectorAll('[data-cancelar-edicao-cartao]').forEach(btn => {
    btn.onclick = () => {
      state.editandoCartaoId = null;
      renderApp();
    };
  });

  // Botão "Fechar fatura" removido — status de fatura agora é derivado automaticamente por data.

  const metodoPagamentoEscolha = {};
  document.querySelectorAll('.metodo-pagamento-btn').forEach(btn => {
    const cartaoId = btn.dataset.metodoPagamento;
    if (!(cartaoId in metodoPagamentoEscolha)) metodoPagamentoEscolha[cartaoId] = 'Pix';
    btn.onclick = () => {
      metodoPagamentoEscolha[cartaoId] = btn.dataset.metodo;
      document.querySelectorAll(`.metodo-pagamento-btn[data-metodo-pagamento="${cartaoId}"]`).forEach(b => {
        b.classList.remove('bg-aura-tint', 'text-aura-primary');
        b.classList.add('bg-white', 'text-aura-muted');
      });
      btn.classList.remove('bg-white', 'text-aura-muted');
      btn.classList.add('bg-aura-tint', 'text-aura-primary');
    };
  });

  document.querySelectorAll('[data-pagar-valor-cheio]').forEach(btn => {
    btn.onclick = () => {
      const cartaoId = btn.dataset.pagarValorCheio;
      const input = document.querySelector(`[data-input-pagamento="${cartaoId}"]`);
      if (input) input.value = btn.dataset.valorCheio;
    };
  });

  async function registrarPagamentoFatura(cartaoId, valor, metodo, dataStr = null) {
    const cartao = state.cartoes.find(c => c.id === cartaoId);
    const data = dataStr || isoLocal(new Date());

    const { error: e1 } = await sb.from('pagamentos_cartao').insert({
      user_id: state.user.id,
      cartao_id: cartaoId,
      valor,
      data,
    });
    if (e1) { alert(e1.message); return false; }

    // Só cria transação de saída se não vier de reconhecimento automático (evita duplicata)
    if (!dataStr) {
      const { error: e2 } = await sb.from('transacoes').insert({
        user_id: state.user.id,
        descricao: `Pagamento fatura ${cartao?.nome || ''}`.trim(),
        valor,
        tipo: 'saida',
        data,
        metodo_pagamento: metodo,
      });
      if (e2) { alert(e2.message); return false; }
    }

    return true;
  }

  // Reconhecimento automático desabilitado: pagamentos de fatura importados pelo Pluggy
  // são detectados diretamente em calcularFaturas() via ehPagamentoFatura().
  // Manter essa função apenas como no-op para não quebrar chamadas existentes.
  async function tentarReconhecerPagamentosAutomaticos() {
    return;
    // Código legado abaixo mantido para referência mas nunca executado
    if (!state.cartoes.length) return;
    const pagamentosExistentes = new Set(state.pagamentosCartao.map(p => `${p.cartao_id}:${p.valor}:${p.data}`));

    const padroesPagamento = /pag(amento)?\s*(fat(ura)?|cc|cart[aã]o)|fat\s*cart[aã]o|pgto\s*cart[aã]o/i;
    const candidatas = state.transacoesCartao.length ? [] :
      (state.visao || state.transacoes).filter(t =>
        t.tipo === 'saida' && !t.cartao_id && padroesPagamento.test(t.descricao || '')
      );
    // Busca também nas transações do mês
    const candidatasMes = state.transacoes.filter(t =>
      t.tipo === 'saida' && !t.cartao_id && padroesPagamento.test(t.descricao || '')
    );
    const todasCandidatas = [...new Map([...candidatas, ...candidatasMes].map(t => [t.id, t])).values()];

    for (const t of todasCandidatas) {
      for (const c of state.cartoes) {
        // Verifica se o nome do cartão aparece na descrição
        const nomeCartao = (c.nome || '').toLowerCase();
        const descLower = (t.descricao || '').toLowerCase();
        const nomeMatch = nomeCartao.length > 2 && descLower.includes(nomeCartao);
        const chave = `${c.id}:${t.valor}:${t.data}`;
        if (nomeMatch && !pagamentosExistentes.has(chave)) {
          const { faturas, abertaIdx } = calcularFaturas(c);
          const deveTotal = Object.entries(faturas)
            .filter(([i]) => Number(i) < abertaIdx)
            .reduce((s, [, f]) => s + Math.max(f.total - f.pago, 0), 0);
          // Só registra se o valor bater com alguma fatura pendente (margem de R$0,10)
          if (deveTotal > 0.005 && Math.abs(t.valor - deveTotal) < 0.10) {
            await sb.from('pagamentos_cartao').insert({
              user_id: state.user.id,
              cartao_id: c.id,
              valor: t.valor,
              data: t.data,
            });
            pagamentosExistentes.add(chave);
          }
        }
      }
    }
  }

  document.querySelectorAll('[data-confirmar-pagamento]').forEach(btn => {
    btn.onclick = async () => {
      const cartaoId = btn.dataset.confirmarPagamento;
      const input = document.querySelector(`[data-input-pagamento="${cartaoId}"]`);
      const valor = parseFloat(input?.value);

      if (!valor || valor <= 0) {
        alert('Informe um valor válido para o pagamento.');
        return;
      }

      const metodo = metodoPagamentoEscolha[cartaoId] || 'Pix';
      const ok = await registrarPagamentoFatura(cartaoId, valor, metodo);
      if (!ok) return;

      await loadAll(true);
      renderApp();
    };
  });

  document.querySelectorAll('[data-fechar-fatura]').forEach(btn => {
    btn.onclick = async () => {
      const cartaoId = btn.dataset.fecharFatura;
      const cartao = state.cartoes.find(c => c.id === cartaoId);
      const data = document.getElementById(`fech-data-${cartaoId}`)?.value || hojeISO();
      const ultima = state.fechamentos.filter(f => f.cartao_id === cartaoId).map(f => f.data_fechamento).sort().pop();
      if (ultima && data < ultima) { alert(`A data precisa ser igual ou posterior ao último fechamento (${fmtData(ultima)}).`); return; }
      if (!confirm(`Fechar a fatura de ${cartao?.nome || 'cartão'} em ${fmtData(data)}?`)) return;
      const { error } = await sb.from('fechamentos_fatura').insert({ user_id: state.user.id, cartao_id: cartaoId, data_fechamento: data });
      if (error) { alert('Não foi possível fechar a fatura: ' + error.message); return; }
      await loadAll(true);
      renderApp();
    };
  });

  document.querySelectorAll('[data-desfazer-fechamento]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Desfazer o último fechamento? As compras voltam para a fatura em aberto.')) return;
      const { error } = await sb.from('fechamentos_fatura').delete().eq('id', btn.dataset.desfazerFechamento);
      if (error) { alert('Não foi possível desfazer: ' + error.message); return; }
      await loadAll(true);
      renderApp();
    };
  });

  bindListaTransacoes();
  bindFiltrosTransacoes();
  bindFaturasMes();
  bindParcelamentos();
  bindVisao();

  document.querySelectorAll('[data-del-cartao]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.delCartao;
      const cartao = state.cartoes.find(c => c.id === id);
      if (!confirm(`Excluir o cartão "${cartao?.nome}"?\n\nO histórico de faturas e pagamentos dele será apagado. As compras já lançadas continuam nas Transações, sem vínculo com o cartão.`)) return;
      const passos = [
        sb.from('fechamentos_fatura').delete().eq('cartao_id', id),
        sb.from('pagamentos_cartao').delete().eq('cartao_id', id),
        sb.from('transacoes').update({ cartao_id: null }).eq('cartao_id', id),
      ];
      for (const passo of passos) {
        const { error } = await passo;
        if (error) { alert('Não foi possível excluir o cartão: ' + error.message); return; }
      }
      const { error } = await sb.from('cartoes').delete().eq('id', id);
      if (error) { alert('Não foi possível excluir o cartão: ' + error.message); return; }
      await loadAll(true);
      renderApp();
    };
  });

  document.querySelectorAll('[data-del-meta]').forEach(btn => {
    btn.onclick = async () => {
      await sb.from('metas').delete().eq('id', btn.dataset.delMeta);
      await loadAll(true);
      renderApp();
    };
  });

  document.querySelectorAll('[data-aporte-meta]').forEach(btn => {
    btn.onclick = async () => {
      const valor = await pedirValor('Adicionar aporte', 'Quanto você quer adicionar a essa meta?');
      if (!valor) return;
      const meta = state.metas.find(m => m.id === btn.dataset.aporteMeta);
      const novoValor = Number(meta.valor_atual || 0) + valor;
      await sb.from('metas').update({ valor_atual: novoValor }).eq('id', meta.id);
      await loadAll(true);
      renderApp();
    };
  });

  document.querySelectorAll('[data-def-orcamento]').forEach(btn => {
    btn.onclick = async () => {
      const categoriaId = btn.dataset.defOrcamento;
      const categoria = state.categorias.find(c => c.id === categoriaId);
      const atual = state.orcamentos.find(o => o.categoria_id === categoriaId);
      const valor = await pedirValor('Orçamento mensal', esc(categoria?.nome || ''), atual ? atual.valor_limite : '', true);
      if (valor === null) return;

      const { error } = await sb.from('orcamentos').upsert(
        { user_id: state.user.id, categoria_id: categoriaId, valor_limite: valor },
        { onConflict: 'user_id,categoria_id' }
      );
      if (error) { alert(error.message); return; }

      await loadAll(true);
      renderApp();
    };
  });

  document.getElementById('cat-salvar')?.addEventListener('click', async () => {
    const nome = document.getElementById('cat-nome').value.trim();
    const tipo = document.getElementById('cat-tipo').value;
    const erro = document.getElementById('cat-erro');

    if (!nome) {
      erro.textContent = 'Informe o nome da categoria.';
      erro.classList.remove('hidden');
      return;
    }

    const { error } = await sb.from('categorias').insert({
      user_id: state.user.id,
      nome,
      tipo,
    });

    if (error) {
      erro.textContent = error.message;
      erro.classList.remove('hidden');
      return;
    }

    await loadAll(true);
    renderApp();
  });

  document.querySelectorAll('[data-del-categoria]').forEach(btn => {
    btn.onclick = async () => {
      const categoria = state.categorias.find(c => c.id === btn.dataset.delCategoria);
      if (!confirm(`Excluir a categoria "${categoria?.nome}"? Isso só funciona se não houver transações usando ela.`)) return;
      const { error } = await sb.from('categorias').delete().eq('id', btn.dataset.delCategoria);
      if (error) { alert('Não foi possível excluir: ' + error.message); return; }
      await loadAll(true);
      renderApp();
    };
  });

  document.getElementById('c-salvar')?.addEventListener('click', async () => {
    const nome = document.getElementById('c-nome').value.trim();
    const limite = parseFloat(document.getElementById('c-limite').value) || null;
    const vencimento = parseInt(document.getElementById('c-vencimento').value) || null;
    const erro = document.getElementById('c-erro');

    if (!nome) {
      erro.textContent = 'Informe o nome do cartão.';
      erro.classList.remove('hidden');
      return;
    }

    const { error } = state.editandoCartaoId
      ? await sb.from('cartoes').update({ nome, limite, dia_vencimento: vencimento }).eq('id', state.editandoCartaoId)
      : await sb.from('cartoes').insert({
          user_id: state.user.id,
          nome,
          limite,
          dia_vencimento: vencimento,
        });

    if (error) {
      erro.textContent = error.message;
      erro.classList.remove('hidden');
      return;
    }

    state.editandoCartaoId = null;
    await loadAll(true);
    renderApp();
  });

  document.getElementById('m-salvar')?.addEventListener('click', async () => {
    const titulo = document.getElementById('m-titulo').value.trim();
    const valorAlvo = parseFloat(document.getElementById('m-valor').value);
    const prazo = document.getElementById('m-prazo').value || null;
    const erro = document.getElementById('m-erro');

    if (!titulo || !valorAlvo || valorAlvo <= 0) {
      erro.textContent = 'Informe título e valor alvo válidos.';
      erro.classList.remove('hidden');
      return;
    }

    const { error } = await sb.from('metas').insert({
      user_id: state.user.id,
      titulo,
      valor_alvo: valorAlvo,
      valor_atual: 0,
      prazo,
    });

    if (error) {
      erro.textContent = error.message;
      erro.classList.remove('hidden');
      return;
    }

    await loadAll(true);
    renderApp();
  });

  document.querySelectorAll('[data-reserva-meses]').forEach(btn => {
    btn.onclick = () => {
      state.reservaMeses = Number(btn.dataset.reservaMeses);
      localStorage.setItem('reservaMeses', state.reservaMeses);
      renderApp();
    };
  });
  document.querySelectorAll('[data-add-invest]').forEach(btn => {
    btn.onclick = () => abrirModalInvest(null, btn.dataset.addInvest);
  });
  document.querySelectorAll('[data-edit-invest]').forEach(btn => {
    btn.onclick = () => abrirModalInvest(btn.dataset.editInvest);
  });
  document.querySelectorAll('[data-del-invest]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Excluir este item?')) return;
      await sb.from('investimentos').delete().eq('id', btn.dataset.delInvest);
      await loadAll(true);
      renderApp();
    };
  });
}

render();
</script>
