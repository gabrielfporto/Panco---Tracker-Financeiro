const esc = (s) => {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
};

// Datas sempre no horário local: toISOString() converte para UTC e, à noite no Brasil, "vira o dia"
const isoLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const monthName = () => {

const addMonths = (dataStr, n) => {

  const ultimoDiaMes = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

  return isoLocal(d);
};

let seedEmAndamento = null;
function seedCategoriasPadrao() {

  seedEmAndamento = (async () => {
    try {

}

// ---------- Data ----------
let globalCarregado = false;

  state.saldoAtualTotal = state.contasBancarias.reduce((sum, c) => sum + Number(c.saldo || 0), 0);
// ...

// ---------- Faturas de cartão ----------
const MESES_ABREV = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const idxDeData = (str) => Number(str.slice(0, 4)) * 12 + (Number(str.slice(5, 7)) - 1);
const idxMesRef = () => state.mesRef.getFullYear() * 12 + state.mesRef.getMonth();
const hojeISO = () => isoLocal(new Date());

// Fechamento manual: cada fatura é encerrada pelo botão "Fechar fatura" (tabela fechamentos_fatura).
// Vencimento: o dia cadastrado no cartão, no mês em que a fatura cai.
function vencimentoDoFechamento(cartao, dataStr) {
  const y = Number(dataStr.slice(0, 4));
  const m = Number(dataStr.slice(5, 7)) - 1;
  const d = Number(dataStr.slice(8, 10));
  const diaVenc = Number(cartao.dia_vencimento) || 0;
  if (!diaVenc) return y * 12 + m + 1;
  const ultimoDiaMes = new Date(y, m + 1, 0).getDate();
  // Fechou até o dia do vencimento: a fatura vence neste mês; depois disso, no mês seguinte
  return d <= Math.min(diaVenc, ultimoDiaMes) ? y * 12 + m : y * 12 + m + 1;
}

function travasDoCartao(cartao) {
  const fechs = state.fechamentos
    .filter(f => f.cartao_id === cartao.id)
    .sort((a, b) => a.data_fechamento.localeCompare(b.data_fechamento) || String(a.created_at || '').localeCompare(String(b.created_at || '')));
  let ultimo = -Infinity;
  return fechs.map(f => {
    const venc = Math.max(vencimentoDoFechamento(cartao, f.data_fechamento), ultimo + 1);
    ultimo = venc;
    return { id: f.id, data: f.data_fechamento, venc, criado: f.created_at || null };
  });
}

// Fatura em aberto: a que será fechada depois de todas as já fechadas
function faturaAbertaIdx(cartao, travas) {
  const base = vencimentoDoFechamento(cartao, hojeISO());
  const ultimo = travas.length ? travas[travas.length - 1].venc : -Infinity;
  return Math.max(base, ultimo + 1);
}

// Em qual fatura cai uma transação de cartão
function faturaDaTransacao(cartao, travas, t) {
  // "Próxima Fatura": vai para a fatura do mês seguinte ao da transação
  if (t.proxima_fatura) return idxDeData(t.data) + 1;
  // Lançamentos anteriores a um fechamento entram na fatura que ele fechou
  for (const tr of travas) {
    const pertence = t.data < tr.data
      || (t.data === tr.data && (!tr.criado || !t.created_at || t.created_at <= tr.criado));
    if (pertence) return tr.venc;
  }
  // Depois do último fechamento: fatura em aberto (ou o mês da transação, se ela for futura, como parcelas)
  return Math.max(faturaAbertaIdx(cartao, travas), idxDeData(t.data));
}

// Detecta se uma transação entrada+cartao_id é pagamento de fatura (Pluggy) vs estorno real
const REGEX_PAGAMENTO_FATURA = /pagamento\s*(com\s*saldo|de\s*fat(ura)?|fatura|cart[aã]o)|pgto\s*(fat(ura)?|cart[aã]o)/i;
function ehPagamentoFatura(t) {
  if (t.tipo !== 'entrada' || !t.cartao_id) return false;
  return REGEX_PAGAMENTO_FATURA.test(t.descricao || '');
}

function calcularFaturas(cartao) {
  const travas = travasDoCartao(cartao);
  const faturas = {};

  // Compras no cartão (saídas)
  state.transacoesCartao
    .filter(t => t.tipo === 'saida' && t.cartao_id === cartao.id)
    .forEach(t => {
      const idx = faturaDaTransacao(cartao, travas, t);
      (faturas[idx] = faturas[idx] || { total: 0, pago: 0, itens: [], estornos: 0 });
      faturas[idx].total += Number(t.valor);
      faturas[idx].itens.push(t);
    });

  // Entradas vinculadas ao cartão: distingue pagamento de fatura vs estorno real
  state.transacoesCartao
    .filter(t => t.tipo === 'entrada' && t.cartao_id === cartao.id)
    .forEach(t => {
      if (ehPagamentoFatura(t)) {
        // Pagamento de fatura importado pelo Pluggy: trata como pagamento, não como estorno
        // Será contabilizado no bloco de fundos abaixo (via pagamentosPluggy)
        return;
      }
      // Estorno real (ex: cancelamento, devolução): reduz o total da fatura do mês da transação
      const idx = faturaDaTransacao(cartao, travas, t);
      if (!faturas[idx]) faturas[idx] = { total: 0, pago: 0, itens: [], estornos: 0 };
      faturas[idx].total = Math.max(0, faturas[idx].total - Number(t.valor));
      faturas[idx].estornos += Number(t.valor);
      faturas[idx].itens.push({ ...t, _ehEstorno: true });
    });

  // Pagamentos: soma lançamentos manuais (pagamentos_cartao) + pagamentos importados pelo Pluggy
  const pagamentosManuais = state.pagamentosCartao
    .filter(p => p.cartao_id === cartao.id)
    .reduce((sum, p) => sum + Number(p.valor), 0);

  const pagamentosPluggy = state.transacoesCartao
    .filter(t => t.cartao_id === cartao.id && ehPagamentoFatura(t))
    .reduce((sum, t) => sum + Number(t.valor), 0);

  // Aplica o total de pagamentos em ordem cronológica das faturas (da mais antiga para a mais nova)
  let fundos = pagamentosManuais + pagamentosPluggy;
  Object.keys(faturas).map(Number).sort((a, b) => a - b).forEach(idx => {
    const f = faturas[idx];
    f.pago = Math.min(Math.max(fundos, 0), f.total);
    fundos -= f.pago;
  });
  return { faturas, abertaIdx: faturaAbertaIdx(cartao, travas) };
}

function faturaExibida(cartao, faturas, abertaIdx) {
  const hoje = hojeISO();
  // Prioridade 1: faturas vencidas com saldo pendente (mais antigas primeiro)
  const vencida = Object.keys(faturas).map(Number).sort((a, b) => a - b)
    .find(i => dataVencimento(cartao, i) < hoje && faturas[i].total - faturas[i].pago > 0.005);
  if (vencida !== undefined) return vencida;
  // Prioridade 2: fatura aberta atual
  return abertaIdx;
}

function dataVencimento(cartao, idx) {
  const y = Math.floor(idx / 12), m = idx % 12;
  const ultimo = new Date(y, m + 1, 0).getDate();
  const dia = Math.min(Number(cartao.dia_vencimento) || ultimo, ultimo);
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}

async function setView(view) {
  state.view = view;
  if (!['inicio', 'transacoes'].includes(view) && !ehMesAtual()) {
    state.mesRef = primeiroDiaDoMes();

function ehMesAtual() {
  const hoje = new Date();
  return state.mesRef.getMonth() === hoje.getMonth() && state.mesRef.getFullYear() === hoje.getFullYear();
}

function seletorMes() { return ''; }
function seletorMesHtml() {

      <button data-mes="-1" class="text-aura-muted text-lg px-4 py-1 md:px-2 md:py-0">←</button>
      <div class="text-center">
        <p class="text-sm font-semibold">${monthName()}</p>

      <button data-mes="1" class="text-aura-muted text-lg px-4 py-1 md:px-2 md:py-0">→</button>

async function carregarVisao() {
  const hoje = new Date();
  const ini = isoLocal(new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1));
  const fim = isoLocal(hoje);
  const todas = [];
  for (let de = 0; ; de += 1000) {
    const { data, error } = await sb.from('transacoes').select('*, categorias(nome, cor)')
      .gte('data', ini).lte('data', fim).order('data', { ascending: false }).order('id').range(de, de + 999);
    if (error || !data) break;
    todas.push(...data);
    if (data.length < 1000) break;
  }
  state.visao = todas;
}

function acumuladoPorDia(ts, ate) {
  const dias = Array(32).fill(0);
  ts.forEach(t => { dias[Number(t.data.slice(8, 10))] += Number(t.valor); });
  const out = [0];
  let acc = 0;
  for (let d = 1; d <= ate; d++) { acc += dias[d]; out[d] = acc; }
  return out;
}

const badgeVariacao = (atual, anterior) => {
  if (!anterior) return '<span class="text-[11px] text-aura-muted">novo</span>';
  const v = (atual - anterior) / anterior * 100;
  const cor = v > 0 ? 'background:#FBE9E9;color:#B83A3A' : 'background:#E3F4EC;color:#0B6B53';
  return `<span class="text-[11px] font-semibold rounded-md px-1.5 py-0.5" style="${cor}">${v > 0 ? '↗' : '↘'} ${Math.abs(Math.round(v))}%</span>`;
};

function visaoHtml() {
  const agora = new Date();
  const iniMes = isoLocal(new Date(agora.getFullYear(), agora.getMonth(), 1));
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // Cartões — exibe apenas a fatura atual (aberta) + faturas vencidas não pagas
  const linhasCartao = state.cartoes.map(c => {
    const { faturas, abertaIdx } = calcularFaturas(c);
    // Soma fatura aberta atual + vencidas não pagas; ignora faturas futuras ainda não abertas
    const usado = Object.entries(faturas).reduce((x, [i, f]) => {
      const iNum = Number(i);
      // inclui: fatura aberta, faturas anteriores com saldo devedor, exclui: faturas futuras (> abertaIdx)
      if (iNum <= abertaIdx) return x + Math.max(f.total - f.pago, 0);
      return x;
    }, 0);
    return { c, limite: Number(c.limite) || 0, usado };
  });
  const limiteTotal = linhasCartao.reduce((x, l) => x + l.limite, 0);
  const totalUsado  = linhasCartao.reduce((x, l) => x + l.usado, 0);
  const pctUsado    = limiteTotal > 0 ? Math.round(totalUsado / limiteTotal * 100) : 0;

  // Investimentos
  const totalInvestido = state.investimentos.reduce((s, i) => s + Number(i.valor_atual || 0), 0);
  const totalAportado  = state.investimentos.reduce((s, i) => s + Number(i.valor_aplicado || 0), 0);
  const rentabilidade  = totalAportado > 0 ? totalInvestido - totalAportado : 0;

  // Vencimentos próximos (7 dias)
  const hoje = hojeISO();
  const em7dias = isoLocal(new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() + 7));
  const vencimentos = state.cartoes.map(c => {
    const { faturas, abertaIdx } = calcularFaturas(c);
    return Object.entries(faturas)
      .filter(([i, f]) => Number(i) < abertaIdx && f.total - f.pago > 0.005)
      .map(([i, f]) => ({ venc: dataVencimento(c, Number(i)), valor: f.total - f.pago, cartao: c.nome }));
  }).flat().filter(v => v.venc >= hoje && v.venc <= em7dias).sort((a, b) => a.venc.localeCompare(b.venc));

  // Transações recentes
  const recentes = [...state.visao].filter(t => !ehFatura(t))
    .sort((a, b) => b.data.localeCompare(a.data) || String(b.created_at || '').localeCompare(String(a.created_at || ''))).slice(0, 6);

// Mapeia e agrupa as contas bancárias para exibir no card estilo a foto
  const bancosMap = {};
  state.contasBancarias.forEach(cb => {
    const b = cb.banco || 'Outro';
    bancosMap[b] = bancosMap[b] || { nome: b, saldo: 0, contasCount: 0, origem: cb.origem_externa };
    bancosMap[b].saldo += Number(cb.saldo || 0);
    bancosMap[b].contasCount += 1;

  const totalContasBancarias = state.saldoAtualTotal;

  return `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
      <div class="bg-white rounded-2xl p-5 card md:col-span-1">
        <p class="text-[11px] font-semibold text-aura-muted tracking-wide mb-2 flex items-center gap-1.5">
          <span class="text-aura-primary">🏛</span> CONTAS BANCÁRIAS
        </p>
        <p class="text-3xl font-extrabold ${totalContasBancarias < 0 ? 'text-aura-danger' : 'text-aura-ink'} mb-4">${fmt(totalContasBancarias)}</p>
        <div class="space-y-3 pt-3 border-t border-aura-line">
          ${listaBancos.map(b => {
            const pct = totalContasBancarias !== 0 ? Math.max(0, Math.min(100, Math.round((b.saldo / Math.abs(totalContasBancarias)) * 100))) : 0;
            const logo = LOGO_BANCO[b.origem] || '';
            return `
              <div class="flex items-center justify-between text-sm">
                <div class="flex items-center gap-2.5 min-w-0">

                    <p class="font-semibold text-aura-ink truncate">${esc(b.nome)}</p>
                    <p class="text-[11px] text-aura-muted">${b.contasCount} ${b.contasCount === 1 ? 'conta' : 'contas'} · ${pct}%</p>
                  </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <span class="font-bold ${b.saldo < 0 ? 'text-aura-danger' : 'text-aura-green'}">${fmt(b.saldo)}</span>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div class="bg-white rounded-2xl p-5 card">
        <p class="text-[11px] font-semibold text-aura-muted tracking-wide mb-3">CARTÕES DE CRÉDITO</p>
        ${state.cartoes.length ? `
          <p class="text-2xl font-bold text-aura-danger">${fmt(totalUsado)}</p>
          <p class="text-xs text-aura-muted mt-1">${pctUsado}% utilizado · Limite ${fmt(limiteTotal)}</p>
          <div class="mt-3 rounded-full overflow-hidden" style="height:6px;background:#E2E7E1">
            <div class="h-full rounded-full" style="width:${Math.min(pctUsado,100)}%;background:${pctUsado > 80 ? '#C1442C' : 'var(--color-primary)'}"></div>

      <div class="bg-white rounded-2xl p-5 card">

          <div class="mt-3 space-y-1">
            ${state.investimentos.slice(0, 4).map(i => `
              <div class="flex justify-between items-center text-sm">
                <span class="font-medium truncate max-w-[60%]">${esc(i.ativo)}</span>

              </div>`).join('')}
            ${state.investimentos.length > 4 ? `<p class="text-xs text-aura-muted pt-1">+${state.investimentos.length - 4} outros</p>` : ''}
          </div>` : '<p class="text-sm text-aura-muted">Nenhum investimento cadastrado.</p>'}
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl p-5 card">
        <p class="text-[11px] font-semibold text-aura-muted tracking-wide mb-3">VENCIMENTOS</p>
        ${vencimentos.length ? `

            ${vencimentos.map(v => `
              <div class="flex justify-between items-center text-sm">

      </div>

      <div class="bg-white rounded-2xl p-5 card">
        <p class="text-[11px] font-semibold text-aura-muted tracking-wide mb-3">TRANSAÇÕES RECENTES</p>
        ${recentes.length ? `
          <div class="space-y-2">
            ${recentes.map(t => `
              <div class="flex justify-between gap-3 text-sm border-b border-aura-line last:border-0 pb-2 last:pb-0">
                <div class="min-w-0">
                  <p class="font-medium truncate">${esc(t.origem_externa ? limparDescricaoBanco(t.descricao) : (t.descricao || t.categorias?.nome || 'Transação'))}</p>

          <button data-nav="transacoes" class="w-full text-center text-xs text-aura-primary font-semibold pt-3">Ver todas →</button>`

}

const PALETA = ['#A3B83A', '#B83A3A', '#3A3AB8', '#2FA36B', '#8A3AB8', '#E0A030', '#3A8FB8', '#B8683A'];
const ehFatura = (t) => (t.descricao || '').startsWith('Pagamento fatura');

function resumoMes() {
  // Entradas: todas exceto estornos de cartão (que já reduzem a fatura)
  const receita = state.transacoes
    .filter(t => t.tipo === 'entrada' && !t.cartao_id)
    .reduce((s, t) => s + Number(t.valor), 0);
  // Despesas: saídas que não sejam via cartão (cartão é contado via fatura) nem pagamento de fatura (para evitar dupla contagem)
  const despesas = state.transacoes
    .filter(t => t.tipo === 'saida' && t.metodo_pagamento !== 'Cartão' && !ehFatura(t))
    .reduce((s, t) => s + Number(t.valor), 0);
  const investir = receita * (state.investirPct / 100);
  return { receita, despesas, investir, saldo: receita - investir - despesas };
}

function listaDaAba(sub) {
  const ts = state.transacoes;
  if (sub === 'receita') return ts.filter(t => t.tipo === 'entrada');
  if (sub === 'fixa') return ts.filter(t => t.tipo === 'saida' && t.serie_id && !ehFatura(t));
  return ts.filter(t => t.tipo === 'saida' && !t.serie_id && !ehFatura(t));
}

function painelLancamentos(sub) {
  const cfg = { receita: ['Receita', 'entrada', '#2FA36B'], fixa: ['Despesa fixa', 'saida', '#B83A3A'], variavel: ['Despesas variáveis', 'saida', '#B83A3A'] }[sub];
  const lista = listaDaAba(sub);
  const total = lista.reduce((s, t) => s + Number(t.valor), 0);
  const porCat = {};
  lista.forEach(t => { const n = t.categorias?.nome || 'Sem categoria'; porCat[n] = (porCat[n] || 0) + Number(t.valor); });
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const corDe = (nome) => PALETA[Math.max(0, cats.findIndex(c => c[0] === nome)) % PALETA.length];
  let acc = 0;
  const grad = cats.length ? cats.map(([, v], i) => { const ini = acc; acc += v / total * 100; return `${PALETA[i % PALETA.length]} ${ini}% ${acc}%`; }).join(',') : '#E2E7E1 0% 100%';

  const linhas = lista.length ? lista.map(t => {
    const nome = t.categorias?.nome || 'Sem categoria';
    const c = corDe(nome);
    return `
      <div class="py-3 border-t border-aura-line text-sm md:grid md:grid-cols-12 md:items-center md:gap-2">
        <div class="flex items-start justify-between gap-3 md:contents">
          <div class="min-w-0 md:contents">
            <span class="block font-medium truncate md:order-2 md:col-span-4">${esc(t.descricao || nome)}</span>
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mt-1 md:mt-0 md:contents">
              <span class="text-xs text-aura-muted md:order-1 md:col-span-2">${fmtData(t.data).slice(0, 5)}</span>
              <span class="min-w-0 max-w-full md:order-3 md:col-span-3"><span class="chip max-w-full" style="background:${c}22;color:${c}">${esc(nome)}</span></span>
            </div>
          </div>
          <span class="shrink-0 flex items-center justify-end gap-2 font-semibold md:order-4 md:col-span-3 ${cfg[1] === 'entrada' ? 'text-aura-green' : 'text-aura-danger'}">
            ${cfg[1] === 'entrada' ? '' : '– '}${fmt(t.valor)}
            ${ehFatura(t) ? '' : `<button data-edit-transacao="${t.id}" class="text-aura-muted text-xs" title="Editar">✎</button>`}
            <button data-del-transacao="${t.id}" class="text-aura-muted text-xs">✕</button>
          </span>
        </div>
      </div>`;
  }).join('') : '<p class="text-sm text-aura-muted py-8 text-center">Nenhum lançamento neste mês.</p>';

  return `
    <button data-limpar="${sub}" class="text-xs text-aura-danger border border-red-200 bg-white rounded-full px-3 py-1.5 mb-4">🗑 Limpar lançamentos</button>
    <div class="lg:grid lg:grid-cols-5 lg:gap-5 space-y-5 lg:space-y-0">
      <div class="lg:col-span-3 bg-white rounded-2xl p-5 card">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold">${cfg[0]}</h2>
          <button data-nova-transacao data-tipo="${cfg[1]}" class="text-sm bg-aura-bg rounded-full px-4 py-2 font-semibold">+ Adicionar</button>
        </div>
        <div class="hidden md:grid grid-cols-12 gap-2 text-xs text-aura-muted pb-2"><span class="col-span-2">Data</span><span class="col-span-4">Nome</span><span class="col-span-3">Categoria</span><span class="col-span-3 text-right">Valor</span></div>
        ${linhas}
        <p class="text-right font-bold text-lg pt-3 border-t border-aura-line ${cfg[1] === 'entrada' ? 'text-aura-green' : 'text-aura-danger'}">${cfg[1] === 'entrada' ? '' : '– '}${fmt(total)}</p>
      </div>
      <div class="lg:col-span-2 bg-white rounded-2xl p-5 card flex flex-col items-center gap-5">
        <div class="donut" style="width:200px;height:200px;background:conic-gradient(${grad})"></div>
        <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-2">
          ${cats.map(([n, v], i) => `<div class="text-sm flex items-center gap-2"><span style="color:${PALETA[i % PALETA.length]}">●</span><span class="chip bg-aura-bg">${Math.round(v / total * 100)}%</span>${esc(n)}</div>`).join('') || '<p class="text-xs text-aura-muted col-span-2 text-center">Sem dados.</p>'}
        </div>
      </div>
    </div>`;
}

function viewOrcamento() {
  const r = resumoMes();
  const sub = state.subtab;
  const card = (rot, val, ico, cor, extra = '') => `
    <div class="bg-white rounded-2xl p-4 md:p-5 card overflow-hidden">

  const corpo = sub === 'visao' ? fatia(viewInicio(), '<div class="md:grid md:grid-cols-3')

    : painelLancamentos(sub);

  return `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
      ${card('RECEITA', r.receita, '$', '#2F8F6B')}

function abrirModalInvestir() {
  const receita = resumoMes().receita;
  const atualizar = (p) => {
    document.getElementById('ip-pct').textContent = p + '%';
    document.getElementById('ip-val').textContent = fmt(receita * p / 100);
  };
  abrirModal({
    titulo: 'Investir', sub: 'Quanto da sua receita você reserva pra investir.',
    corpo: `
      <p id="ip-pct" class="text-4xl font-extrabold text-center text-blue-600"></p>
      <input id="ip-range" type="range" min="0" max="100" value="${state.investirPct}" class="w-full" style="accent-color:#3B6FD4" />
      <div class="grid grid-cols-4 gap-2">${[20, 30, 40, 50].map(p => `<button data-p="${p}" class="btn-ghost text-sm !px-0">${p}%</button>`).join('')}</div>
      <p class="text-center text-xs font-semibold text-blue-600 pt-2">Valor a Investir</p>
      <p id="ip-val" class="text-3xl font-extrabold text-center text-blue-600"></p>
      <p class="text-xs text-aura-muted text-center">O valor acompanha a receita do mês.</p>`,
    onOpen: (el) => {
      const range = el.querySelector('#ip-range');
      atualizar(range.value);
      range.oninput = () => atualizar(range.value);
      el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { range.value = b.dataset.p; atualizar(range.value); });
    },
    onOk: () => {
      state.investirPct = Number(document.getElementById('ip-range').value);
      localStorage.setItem('investirPct', state.investirPct);
      fecharModal(); renderApp();
    },
  });
}

function viewInicio() {
  // Entradas: excluir estornos de cartão (entrada com cartao_id)
  const entradasMes = state.transacoes
    .filter(t => t.tipo === 'entrada' && !t.cartao_id)
    .reduce((s, t) => s + Number(t.valor), 0);
  // Saídas: excluir compras no cartão (contadas via fatura) e pagamentos de fatura (evitar dupla contagem)
  const saidasMes = state.transacoes
    .filter(t => t.tipo === 'saida' && t.metodo_pagamento !== 'Cartão' && !ehFatura(t))
    .reduce((s, t) => s + Number(t.valor), 0);
  const saldoMes = entradasMes - saidasMes;
  const saldoAtual = state.saldoAtualTotal;

  const rendaEsperadaTotal = state.orcamentos
    .filter(o => state.categorias.find(c => c.id === o.categoria_id)?.tipo === 'entrada')
    .reduce((s, o) => s + Number(o.valor_limite), 0);
  const despesaOrcadaTotal = state.orcamentos
    .filter(o => state.categorias.find(c => c.id === o.categoria_id)?.tipo === 'saida')
    .reduce((s, o) => s + Number(o.valor_limite), 0);

  let saldoPrevisto;
  let previsaoBaseadaEmPlano = rendaEsperadaTotal > 0 || despesaOrcadaTotal > 0;
  if (previsaoBaseadaEmPlano) {
    const rendaQueFalta = Math.max(rendaEsperadaTotal - entradasMes, 0);
    const despesaQueFalta = Math.max(despesaOrcadaTotal - saidasMes, 0);
    saldoPrevisto = saldoAtual + rendaQueFalta - despesaQueFalta;
  } else {
    const hoje = new Date();
    const diaAtual = hoje.getDate();
    const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
    const diasRestantes = Math.max(diasNoMes - diaAtual, 0);
    const mediaDiaria = saldoMes / Math.max(diaAtual, 1);
    saldoPrevisto = saldoAtual + mediaDiaria * diasRestantes;
  }

  const porCartao = {};
  state.cartoes.forEach(c => { porCartao[c.id] = { nome: c.nome, total: 0 }; });
  state.transacoes.filter(t => t.tipo === 'saida' && t.cartao_id).forEach(t => {
    if (porCartao[t.cartao_id]) porCartao[t.cartao_id].total += Number(t.valor);
  });
  const gastosCartoesMes = Object.values(porCartao).reduce((s, c) => s + c.total, 0);

  const recentes = state.transacoes.slice(0, 5);

  return `
    <div class="">
      <div class="flex items-start justify-between mb-6">
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-2xl font-bold leading-tight">Olá, ${nomeExibicao()}</h1>
            <button id="btn-edit-nome" class="text-aura-muted text-sm" title="Editar nome">✎</button>
          </div>
          <p class="text-aura-muted text-sm">Visão geral</p>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <button data-nova-transacao class="text-xs text-white bg-aura-primary rounded-full px-3 py-2 font-semibold whitespace-nowrap">+ Nova</button>
          <button id="btn-logout" class="md:hidden text-xs text-aura-muted underline">Sair</button>
        </div>
      </div>

      ${seletorMes()}

      <div class="md:grid md:grid-cols-3 md:gap-6">
        <div class="md:col-span-2 space-y-6">
          <div class="rounded-2xl bg-aura-primary text-white p-6 card">
            <div class="flex items-center justify-between mb-4">
              <span class="text-sm text-white/80">Saldo do mês (conta bancária)</span>
              <span class="text-xs bg-white/15 rounded-full px-3 py-1">${saldoMes >= 0 ? 'No verde' : 'No vermelho'}</span>
            </div>
            <p class="text-3xl md:text-4xl font-extrabold mb-5">${fmt(saldoMes)}</p>
            <div class="flex gap-8">
              <div>
                <p class="text-xs text-white/70">ENTRADAS</p>
                <p class="font-semibold">${fmt(entradasMes)}</p>
              </div>
              <div>
                <p class="text-xs text-white/70">SAÍDAS</p>
                <p class="font-semibold">${fmt(saidasMes)}</p>
              </div>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-3">
              <h2 class="font-semibold">Últimas transações</h2>
              <button data-nav-inline="transacoes" class="text-sm text-aura-primary font-semibold">Ver todas</button>
            </div>
            <div class="space-y-2">
              ${recentes.length === 0
                ? `<p class="text-aura-muted text-sm py-6 text-center">Nenhuma transação este mês ainda.</p>`
                : recentes.map(rowTransacao).join('')}
            </div>
          </div>
        </div>

        <div class="md:col-span-1 space-y-4 mt-6 md:mt-0">
          <div class="bg-white rounded-xl p-4 card">
            <p class="text-xs text-aura-muted mb-1">SALDO ATUAL</p>
            <p class="text-xl font-bold ${saldoAtual < 0 ? 'text-aura-danger' : ''}">${fmt(saldoAtual)}</p>
          </div>
          <div class="bg-white rounded-xl p-4 card">
            <p class="text-xs text-aura-muted mb-1">SALDO PREVISTO (fim do mês)</p>
            <p class="text-xl font-bold ${saldoPrevisto < 0 ? 'text-aura-danger' : ''}">${fmt(saldoPrevisto)}</p>
            <p class="text-xs text-aura-muted mt-2">${previsaoBaseadaEmPlano ? 'Baseado na renda esperada e no orçamento definidos no Planejamento' : 'Estimativa com base no ritmo de gastos deste mês (defina o planejamento para uma previsão mais precisa)'}</p>
          </div>
          <div class="bg-white rounded-xl p-4 card">
            <p class="text-xs text-aura-muted mb-1">GASTO NOS CARTÕES (mês)</p>
          <p class="text-xl font-bold mb-2 ${gastosCartoesMes > 0 ? (isThemeNegative() ? 'text-aura-danger' : 'text-aura-primary') : ''}">${fmt(gastosCartoesMes)}</p>
          ${Object.values(porCartao).filter(c => c.total > 0).map(c => `
            <div class="flex justify-between text-xs text-aura-muted mt-1">
              <span>${esc(c.nome)}</span><span>${fmt(c.total)}</span>
            </div>
          `).join('') || `<p class="text-xs text-aura-muted">Nenhum gasto em cartão este mês.</p>`}
        </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function limparDescricaoBanco(desc) {
  if (!desc) return 'Transação';
  return desc
    .replace(/^(saída|saida|entrada|fluxo|aplicação|aplicacao|pagamento|transferência|transferencia)\s+/i, '')
    .replace(/\s+/g, ' ')
    .trim();
}

    </tr>`;

  return mobile + desktop;
}

const normalizaTexto = (x) => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const acharTransacao = (id) => state.transacoes.find(x => x.id === id) || (state.todasTransacoes || []).find(x => x.id === id);
const buscaGlobal = () => !!(state.filtros.q.trim() || state.filtros.de || state.filtros.ate);
const filtrosAtivos = () => buscaGlobal() || !!(state.filtros.tipo || state.filtros.categoria);

function transacoesVisiveis() {
  const f = state.filtros;
  const q = normalizaTexto(f.q.trim());
  const base = buscaGlobal() ? (state.todasTransacoes || []) : state.transacoes;
  return base.filter(t =>
    (!f.tipo || t.tipo === f.tipo)
    && (!f.categoria || (f.categoria === '__sem' ? !t.categoria_id : t.categoria_id === f.categoria))
    && (!f.de || t.data >= f.de)
    && (!f.ate || t.data <= f.ate)
    && (!q || normalizaTexto(`${t.descricao || ''} ${t.categorias?.nome || ''}`).includes(q))
  );
}

function listaTransacoesHtml() {
  if (buscaGlobal() && !state.todasTransacoes) return `<p class="text-aura-muted text-sm py-10 text-center">Buscando…</p>`;
  const lista = transacoesVisiveis();
  if (lista.length === 0) {
    return `<p class="text-aura-muted text-sm py-10 text-center">${filtrosAtivos() ? 'Nenhuma transação encontrada com esses filtros.' : 'Nenhuma transação este mês ainda.'}</p>`;
  }
  return `
    <!-- Mobile: cards -->
    <div class="md:hidden space-y-2">${lista.map(rowTransacaoMobile).join('')}</div>
    <!-- Desktop: tabela -->
    <div class="hidden md:block bg-white rounded-2xl overflow-hidden" style="box-shadow:0 1px 2px rgba(19,35,28,0.06)">
      <table class="w-full" style="border-collapse:collapse">
        <thead>
          <tr style="border-bottom:1px solid #E2E7E1">
            <th class="text-left py-3 pl-6 pr-4" style="font-size:11px;font-weight:600;color:#5B6B62;letter-spacing:.06em;width:40%">DESCRIÇÃO</th>
            <th class="text-left py-3 px-4" style="font-size:11px;font-weight:600;color:#5B6B62;letter-spacing:.06em;width:20%">CATEGORIA</th>
            <th class="text-left py-3 px-4" style="font-size:11px;font-weight:600;color:#5B6B62;letter-spacing:.06em;width:14%">CONTA</th>
            <th class="text-left py-3 px-4" style="font-size:11px;font-weight:600;color:#5B6B62;letter-spacing:.06em;width:12%">DATA</th>
            <th class="text-right py-3 px-4" style="font-size:11px;font-weight:600;color:#5B6B62;letter-spacing:.06em;width:12%">VALOR</th>
            <th class="py-3 pl-2 pr-5" style="width:40px"></th>
          </tr>
        </thead>
        <tbody>${lista.map(rowTransacaoDesktop).join('')}</tbody>
      </table>
    </div>`;
}

function rowTransacaoMobile(t) {

      <div class="min-w-0 flex-1">
        <p class="font-medium text-sm truncate" style="color:#13231C">${esc(desc)}${badgeSerie}</p>
        <p class="text-xs mt-0.5" style="color:#5B6B62">${fmtData(t.data)}${catNome ? ' · ' + esc(catNome) : ''}${contaLabel ? ' · ' + esc(contaLabel) : ''}</p>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <p class="font-semibold text-sm" style="color:${corValor}">${prefValor}${fmt(Math.abs(t.valor))}</p>

          <button class="menu-dots-btn flex items-center justify-center w-8 h-8 rounded-full" style="color:#5B6B62;font-size:18px;line-height:1" data-menu-t="${t.id}">⋮</button>
          <div data-menu-panel id="menu-m-${t.id}" class="hidden absolute right-0 z-30 bg-white rounded-xl py-1 w-44" style="top:36px;box-shadow:0 8px 24px rgba(19,35,28,.16);border:1px solid #E2E7E1">
            ${!ehFatura(t) ? `<button data-edit-transacao="${t.id}" class="w-full text-left px-4 py-2.5 text-sm" style="color:#13231C">✎ Editar</button>` : ''}
            ${t.serie_id ? `<button data-edit-serie="${t.id}" class="w-full text-left px-4 py-2.5 text-sm" style="color:#13231C">↻ Editar série</button>` : ''}

          </div>
        </div>

    </div>`;
}

          <span style="font-size:14px;font-weight:500;color:#13231C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px">${esc(desc)}${t.serie_id ? ' <span style="color:#5B6B62;font-size:11px">↻</span>' : ''}</span>
        </div>
      </td>
      <td style="padding:14px 16px">
        ${catNome
          ? `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:#F3F5F2;color:#5B6B62">${catIco} ${esc(catNome)}</span>`
          : `<span style="color:#5B6B62;font-size:13px">—</span>`}

      <td style="padding:14px 16px">
        ${contaLabel

      <td style="padding:14px 16px;text-align:right;font-size:14px;font-weight:600;color:${corValor};white-space:nowrap">${prefValor}${fmt(Math.abs(t.valor))}</td>
      <td style="padding:14px 16px 14px 8px;text-align:right;width:40px">
        <div style="position:relative;display:inline-block">
          <button class="menu-dots-btn" data-menu-t="${t.id}"
            style="opacity:0;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#5B6B62;font-size:18px;transition:opacity .15s;cursor:pointer"
            onmouseover="this.style.background='#F3F5F2'" onmouseout="this.style.background=''"
            >⋮</button>
          <div data-menu-panel id="menu-d-${t.id}" class="hidden" style="position:absolute;right:0;top:36px;z-index:30;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(19,35,28,.16);border:1px solid #E2E7E1;padding:4px 0;width:180px">
            ${!ehFatura(t) ? `<button data-edit-transacao="${t.id}" style="width:100%;text-align:left;padding:10px 16px;font-size:14px;color:#13231C;background:none;border:none;cursor:pointer" onmouseover="this.style.background='#F3F5F2'" onmouseout="this.style.background=''">✎ Editar</button>` : ''}
            ${t.serie_id ? `<button data-edit-serie="${t.id}" style="width:100%;text-align:left;padding:10px 16px;font-size:14px;color:#13231C;background:none;border:none;cursor:pointer" onmouseover="this.style.background='#F3F5F2'" onmouseout="this.style.background=''">↻ Editar série</button>` : ''}
            <button data-del-transacao="${t.id}" style="width:100%;text-align:left;padding:10px 16px;font-size:14px;color:#C1442C;background:none;border:none;cursor:pointer" onmouseover="this.style.background='#FBE9E9'" onmouseout="this.style.background=''">✕ Excluir</button>
          </div>
        </div>
      </td>
    </tr>`;
}

function getCatIco(catNome, ehEntrada, ehEstorno) {
  const n = (catNome || '').toLowerCase();
  if (n.includes('mercado') || n.includes('aliment')) return '🛒';
  if (n.includes('transport') || n.includes('uber') || n.includes('carro')) return '🚗';
  if (n.includes('saúde') || n.includes('farmác') || n.includes('médic')) return '💊';
  if (n.includes('lazer') || n.includes('entret')) return '🎬';
  if (n.includes('assinatur')) return '📱';
  if (n.includes('roupa') || n.includes('vestuár')) return '👕';
  if (n.includes('invest') || n.includes('aplicaç')) return '💰';
  if (n.includes('salário') || n.includes('mesada') || n.includes('renda') || n.includes('serviç')) return '💵';
  if (n.includes('aluguel') || n.includes('resid')) return '🏠';
  if (n.includes('present')) return '🎁';
  if (n.includes('viagem') || n.includes('hotel')) return '✈️';
  if (n.includes('educaç') || n.includes('curso')) return '📚';
  if (n.includes('compras')) return '🛍️';
  if (n.includes('cuidado') || n.includes('pessoal')) return '🧴';
  if (n.includes('manutenç')) return '🔧';
  if (n.includes('imprevist')) return '⚡';
  if (ehEstorno) return '↩️';
  return ehEntrada ? '💵' : '💸';
}

function resumoFiltroHtml() {
  if (!filtrosAtivos() || (buscaGlobal() && !state.todasTransacoes)) return '';
  const lista = transacoesVisiveis();
  const soma = (tipo) => lista.filter(t => t.tipo === tipo).reduce((s, t) => s + Number(t.valor), 0);
  return `${lista.length} transação(ões) · Entradas ${fmt(soma('entrada'))} · Saídas ${fmt(soma('saida'))}`
    + (buscaGlobal() ? ' · em todo o histórico' : ` · em ${monthName()}`);
}

      <p id="f-resumo" style="font-size:12px;color:#5B6B62;margin-top:-4px">${resumoFiltroHtml()}</p>

      <!-- Lista -->
      <div id="lista-transacoes">${listaTransacoesHtml()}</div>
    </div>
  `;
}

async function carregarTodasTransacoes() {
  if (state.carregandoTodas) return state.carregandoTodas;
  state.carregandoTodas = (async () => {
    const todas = [];
    const passo = 1000;
    for (let de = 0; ; de += passo) {
      const { data, error } = await sb.from('transacoes').select('*, categorias(nome, cor)')
        .order('data', { ascending: false }).order('id').range(de, de + passo - 1);
      if (error || !data) break;
      todas.push(...data);
      if (data.length < passo) break;
    }
    state.todasTransacoes = todas;
  })().finally(() => { state.carregandoTodas = null; });
  return state.carregandoTodas;
}

async function atualizarListaTransacoes() {
  const lerCampo = (id) => document.getElementById(id)?.value || '';
  if (!document.getElementById('lista-transacoes')) return;
  const de = lerCampo('f-de') || lerCampo('f-de-mob');
  const ate = lerCampo('f-ate') || lerCampo('f-ate-mob');
  state.filtros = { q: lerCampo('f-q'), tipo: lerCampo('f-tipo'), categoria: lerCampo('f-cat'), de, ate };
  const pintar = () => {
    const alvo = document.getElementById('lista-transacoes');
    if (!alvo) return;
    alvo.innerHTML = listaTransacoesHtml();
    document.getElementById('f-resumo').textContent = resumoFiltroHtml();
    document.getElementById('f-limpar')?.classList.toggle('hidden', !filtrosAtivos());
    bindListaTransacoes(alvo);
  };
  pintar();
  if (buscaGlobal() && !state.todasTransacoes) {
    await carregarTodasTransacoes();
    pintar();
  }
}

function bindFiltrosTransacoes() {
  if (!document.getElementById('lista-transacoes')) return;

  // Busca e selects
  document.getElementById('f-q')?.addEventListener('input', atualizarListaTransacoes);
  ['f-tipo', 'f-cat', 'f-de', 'f-ate'].forEach(id => document.getElementById(id)?.addEventListener('change', atualizarListaTransacoes));

  // Inputs de data mobile — sincroniza com os desktop
  document.getElementById('f-de-mob')?.addEventListener('change', e => {
    const d = document.getElementById('f-de'); if (d) { d.value = e.target.value; atualizarListaTransacoes(); }
  });
  document.getElementById('f-ate-mob')?.addEventListener('change', e => {
    const d = document.getElementById('f-ate'); if (d) { d.value = e.target.value; atualizarListaTransacoes(); }
  });

  // Limpar filtros
  document.getElementById('f-limpar')?.addEventListener('click', () => {
    ['f-q','f-tipo','f-cat','f-de','f-ate','f-de-mob','f-ate-mob'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    atualizarListaTransacoes();
  });

  // Dropdown de mês
  const btnMes = document.getElementById('btn-mes-pill');
  const ddMes  = document.getElementById('dropdown-mes');
  btnMes?.addEventListener('click', e => { e.stopPropagation(); ddMes?.classList.toggle('hidden'); });
  document.addEventListener('click', () => ddMes?.classList.add('hidden'), { once: false });
  ddMes?.addEventListener('click', e => e.stopPropagation());

  ddMes?.querySelectorAll('[data-fmes]').forEach(btn => {
    btn.addEventListener('click', () => {
      const delta = Number(btn.dataset.fmes);
      const r = state.mesRef;
      state.mesRef = delta === 0 ? primeiroDiaDoMes() : new Date(r.getFullYear(), r.getMonth() + delta, 1);
      state.todasTransacoes = null;
      renderApp();
    });
  });

  // Hover nas linhas da tabela: revela o botão ⋮
  document.querySelectorAll('#lista-transacoes tr').forEach(tr => {
    const btn = tr.querySelector('.menu-dots-btn');
    if (!btn) return;
    tr.addEventListener('mouseenter', () => { btn.style.opacity = '1'; });
    tr.addEventListener('mouseleave', () => { btn.style.opacity = '0'; });
  });

  // Menu ⋮ (abre/fecha). Registrado uma única vez. O menu é achado pelo próprio botão,
  // porque cada transação existe em duas versões (mobile e desktop).
  if (!window.__menuTransacoes) {
    window.__menuTransacoes = true;
    document.addEventListener('click', e => {
      const btn = e.target.closest('.menu-dots-btn');
      const menus = document.querySelectorAll('[data-menu-panel]');
      if (!btn) { menus.forEach(m => m.classList.add('hidden')); return; }
      const menu = btn.parentElement?.querySelector(':scope > [data-menu-panel]');
      const abrir = !!menu && menu.classList.contains('hidden');
      menus.forEach(m => m.classList.add('hidden'));
      if (abrir) menu.classList.remove('hidden');
    });
  }

  if (buscaGlobal() && !state.todasTransacoes) atualizarListaTransacoes();
}

async function excluirTransacao(id) {
  const t = acharTransacao(id);
  if (t?.serie_id) {
    const escolha = prompt(
      'Essa transação faz parte de uma série (recorrente ou parcelada).\n\n' +
      'Digite o número da opção:\n' +
      '1 = excluir só esta\n' +
      '2 = excluir esta e as futuras da série\n' +
      '3 = excluir a série inteira\n\n' +
      '(qualquer outro valor cancela)'
    );
    if (escolha === '1') {
      await sb.from('transacoes').delete().eq('id', id);
    } else if (escolha === '2') {
      await sb.from('transacoes').delete().eq('serie_id', t.serie_id).gte('data', t.data);
    } else if (escolha === '3') {
      await sb.from('transacoes').delete().eq('serie_id', t.serie_id);
    } else {
      return;
    }
  } else {
    await sb.from('transacoes').delete().eq('id', id);
  }
  await loadAll(true);
  renderApp();
}

async function editarSerie(id) {
  const t = acharTransacao(id);
  if (!t?.serie_id) return;
  const novoValor = await pedirValor('Editar série', `Novo valor desta e das próximas ocorrências (a partir de ${fmtData(t.data)}).`, t.valor);
  if (novoValor === null) return;
  const { error } = await sb.from('transacoes').update({ valor: novoValor }).eq('serie_id', t.serie_id).gte('data', t.data);
  if (error) { alert(error.message); return; }
  await loadAll(true);
  renderApp();
}

function bindListaTransacoes(raiz = document) {
  raiz.querySelectorAll('[data-del-transacao]').forEach(btn => { btn.onclick = () => excluirTransacao(btn.dataset.delTransacao); });
  raiz.querySelectorAll('[data-edit-transacao]').forEach(btn => { btn.onclick = () => editarTransacao(btn.dataset.editTransacao); });
  raiz.querySelectorAll('[data-edit-serie]').forEach(btn => { btn.onclick = () => editarSerie(btn.dataset.editSerie); });
}

let modalOnClose = null;
function fecharModal() {
  const m = document.getElementById('modal-root');
  document.removeEventListener('keydown', escModal);
  const cb = modalOnClose; modalOnClose = null;
  if (m) { m.classList.add('closing'); setTimeout(() => m.remove(), 160); }
  cb?.();
}
function escModal(e) { if (e.key === 'Escape') fecharModal(); }
function abrirModal({ titulo, sub = '', corpo, ok = 'Salvar', onOk, onOpen }) {
  document.getElementById('modal-root')?.remove();
  modalOnClose = null;
  const el = document.createElement('div');
  el.id = 'modal-root';
  el.className = 'modal-overlay';
  el.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="flex items-start justify-between mb-1">
        <h2 class="text-lg font-bold">${titulo}</h2>
        <button data-x class="text-aura-muted text-lg leading-none px-1" aria-label="Fechar">✕</button>
      </div>
      ${sub ? `<p class="text-sm text-aura-muted mb-4">${sub}</p>` : '<div class="mb-3"></div>'}
      <div class="space-y-3">${corpo}</div>
      <p id="modal-erro" class="text-aura-danger text-sm mt-3 hidden"></p>
      <div class="flex justify-end gap-2 mt-6">
        <button data-x class="btn-ghost">Cancelar</button>
        <button id="modal-ok" class="btn-primary">${ok}</button>
      </div>
    </div>`;
  el.addEventListener('mousedown', (e) => { if (e.target === el) fecharModal(); });
  el.querySelectorAll('[data-x]').forEach(b => b.onclick = fecharModal);
  document.body.appendChild(el);
  document.addEventListener('keydown', escModal);
  if (onOk) document.getElementById('modal-ok').onclick = onOk;
  onOpen?.(el);
  el.querySelector('input:not([type=checkbox]),select')?.focus();
}
const erroModal = (msg) => {
  const e = document.getElementById('modal-erro');
  if (e) { e.textContent = msg; e.classList.remove('hidden'); }
};
function pedirValor(titulo, sub, inicial = '', permitirZero = false) {
  return new Promise((resolve) => {
    const confirmar = () => {
      const v = parseFloat(document.getElementById('pv').value);
      if (!Number.isFinite(v) || v < 0 || (v === 0 && !permitirZero)) return erroModal('Informe um valor válido.');
      modalOnClose = null; fecharModal(); resolve(v);
    };
    abrirModal({
      titulo, sub, ok: 'Salvar', onOk: confirmar,
      corpo: `<div class="field-money"><span>R$</span><input id="pv" type="number" step="0.01" inputmode="decimal" placeholder="0,00" value="${inicial}" /></div>`,
      onOpen: (el) => el.querySelector('#pv').addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmar(); }),
    });
    modalOnClose = () => resolve(null);
  });
}

function irParaNovaTransacao(tipo) {
  if (typeof tipo !== 'string') tipo = '';
  abrirModal({
    titulo: tipo === 'saida' ? 'Nova Despesa' : tipo === 'entrada' ? 'Nova Receita' : 'Nova transação',
    sub: 'Lançamento deste mês.',
    ok: 'Adicionar',
    corpo: novaTransacaoBody(),
    onOpen: () => { bindNovaTransacao(); if (tipo) document.querySelector(`.tipo-btn[data-tipo="${tipo}"]`)?.click(); },
  });
}

function editarTransacao(id) {
  const t = acharTransacao(id);
  if (!t) return;
  abrirModal({
    titulo: 'Editar transação',
    sub: t.serie_id ? 'Faz parte de uma série (recorrente ou parcelada).' : '',
    ok: 'Salvar alterações',
    corpo: novaTransacaoBody() + (t.serie_id ? `
      <div class="opt-card">
        <label class="flex items-center gap-2 text-sm font-medium"><input id="aplicar-serie" type="checkbox" class="w-4 h-4" /> Aplicar também às próximas da série</label>
        <p class="text-xs text-aura-muted mt-1">Valor, categoria e método mudam nesta e nas próximas; a data muda só nesta.</p>
      </div>` : ''),
    onOpen: () => bindNovaTransacao(t),
  });
}

function viewCartoes() {
  const editando = state.editandoCartaoId ? state.cartoes.find(c => c.id === state.editandoCartaoId) : null;
  const hoje = hojeISO();
  const agora = new Date();
  const syncStr = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  // Fatura total consolidada (soma das faturas abertas de todos os cartões)
  const faturaTotal = state.cartoes.reduce((sum, c) => {
    const { faturas, abertaIdx } = calcularFaturas(c);
    const fat = faturas[abertaIdx] || { total: 0, pago: 0 };
    return sum + Math.max(fat.total - fat.pago, 0);
  }, 0);

  const cartoesHtml = state.cartoes.length === 0
    ? `<p class="text-aura-muted text-sm py-6 text-center">Nenhum cartão cadastrado.</p>`
    : state.cartoes.map(c => {
        const { faturas, abertaIdx } = calcularFaturas(c);
        const idxVista = faturaExibida(c, faturas, abertaIdx);
        const qtdVencidas = Object.keys(faturas).map(Number)
          .filter(i => dataVencimento(c, i) < hoje && faturas[i].total - faturas[i].pago > 0.005).length;
        const fat = faturas[idxVista] || { total: 0, pago: 0, itens: [] };
        const restante = Math.max(fat.total - fat.pago, 0);
        const vencStr = dataVencimento(c, idxVista);
        const quitada = fat.total > 0 && restante < 0.005;
        const ehAberta = idxVista === abertaIdx;
        const status = quitada ? 'Paga'
          : vencStr < hoje && restante > 0 ? 'Vencida'
          : idxVista < abertaIdx ? 'Fechada'
          : ehAberta ? 'Em aberto' : 'Futura';
        const corStatusBg = status === 'Vencida' ? 'background:#FBE9E9;color:#C1442C'
          : status === 'Paga' ? 'background:#E3EFE8;color:#0B6B53'
          : status === 'Em aberto' ? 'background:#FFF7E6;color:#E0A030'
          : 'background:#F3F5F2;color:#5B6B62';

        const usadoLimite = Object.entries(faturas).reduce((sum, [i, f]) => {
          return Number(i) <= abertaIdx ? sum + Math.max(f.total - f.pago, 0) : sum;
        }, 0);
        const totalComprometido = Object.values(faturas).reduce((sum, f) => sum + Math.max(f.total - f.pago, 0), 0);
        const limiteTotal = Number(c.limite) || 0;
        const pctUsado = limiteTotal > 0 ? Math.min(usadoLimite / limiteTotal * 100, 100) : 0;
        const pctDisp = limiteTotal > 0 ? Math.max(100 - pctUsado, 0) : 0;
        const disponivel = limiteTotal > 0 ? Math.max(limiteTotal - usadoLimite, 0) : 0;

        // Data de vencimento formatada como "07 de nov."
        const fmtVencimento = (str) => {
          if (!str) return '—';
          const d = new Date(str + 'T00:00:00');
          const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
          return `${String(d.getDate()).padStart(2,'0')} de ${meses[d.getMonth()]}.`;
        };

        const travas = travasDoCartao(c);
        const ultimoFech = travas[travas.length - 1];
        const fechDaFatura = travas.find(tr => tr.venc === idxVista)?.data;

        const cores = ['#0B6B53','#3B6FD4','#8A3AB8','#B83A3A','#E0A030','#3A3AB8'];
        const corAvatar = cores[(c.nome || '').length % cores.length];

        return `
          <div class="bg-white rounded-2xl p-5 card relative overflow-hidden">
            <!-- Decoração de fundo -->
            <div class="absolute right-0 top-0 w-32 h-32 rounded-full opacity-5 pointer-events-none" style="background:${corAvatar};transform:translate(30%,-30%)"></div>

            <div class="flex items-start justify-between gap-3 mb-4">
              <div class="flex items-center gap-3 min-w-0">
                <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 overflow-hidden" style="background:${corAvatar}">${getLogoCartao(c.nome)}</div>
                <div class="min-w-0">
                  <p class="font-semibold text-base leading-tight truncate">${esc(c.nome)}</p>
                  <p class="text-xs text-aura-muted mt-0.5">Vencimento todo dia ${c.dia_vencimento ?? '—'}</p>
                </div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full" style="${corStatusBg}">${status}</span>
                <button data-edit-cartao="${c.id}" class="text-aura-muted text-sm w-7 h-7 flex items-center justify-center rounded-full hover:bg-aura-bg">✎</button>
                <button data-del-cartao="${c.id}" class="text-aura-muted text-sm w-7 h-7 flex items-center justify-center rounded-full hover:bg-aura-bg">✕</button>
              </div>
            </div>

            <!-- Fatura estimada -->
            <div class="mb-1">
              <p class="text-[11px] font-semibold text-aura-muted tracking-wide mb-0.5">FATURA ESTIMADA</p>
              <p class="text-2xl font-extrabold">${fmt(fat.total)}</p>
              <p class="text-xs text-aura-muted mt-0.5">${fechDaFatura ? `Fechada em ${fmtData(fechDaFatura)}` : ehAberta ? (ultimoFech ? `Aberta desde ${fmtData(ultimoFech.data)}` : 'Aberta · sem fechamento ainda') : 'Aguardando fechamento'}</p>
              ${fat.pago > 0 ? `<p class="text-xs mt-1" style="color:#0B6B53">Pago: ${fmt(fat.pago)}${restante > 0.005 ? ` · Falta: ${fmt(restante)}` : ' ✓'}</p>` : ''}
              ${qtdVencidas > 1 ? `<p class="text-xs mt-1" style="color:#C1442C">⚠ ${qtdVencidas} fatura(s) vencida(s) sem pagar</p>` : ''}
            </div>

            ${vencStr ? `<p class="text-xs text-aura-muted mb-4">Vence <span class="font-semibold text-aura-ink">${fmtVencimento(vencStr)}</span></p>` : '<div class="mb-4"></div>'}

            <div>
              <div class="flex justify-between items-center mb-2">
                <p class="text-xs text-aura-muted font-medium">Limite total</p>
                <p class="text-xs font-semibold text-aura-ink">${fmt(limiteTotal)}</p>
              </div>
              <div class="rounded-full overflow-hidden flex" style="height:10px;background:#E2E7E1">
                <div class="h-full rounded-l-full" style="width:${pctUsado}%;background:#4A90D9;transition:width .3s"></div>
                <div class="h-full rounded-r-full" style="width:${pctDisp}%;background:#2FA36B;transition:width .3s"></div>
              </div>
              <div class="flex justify-between mt-2">
                <div class="flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#4A90D9"></span>
                  <span class="text-xs text-aura-muted">Usado</span>
                  <span class="text-xs font-semibold">${fmt(usadoLimite)}</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full inline-block" style="background:#2FA36B"></span>
                  <span class="text-xs text-aura-muted">Disponível</span>
                  <span class="text-xs font-semibold">${fmt(disponivel)}</span>
                </div>
              </div>
              ${totalComprometido > usadoLimite ? `<p class="text-xs text-aura-muted mt-1">+ ${fmt(totalComprometido - usadoLimite)} em parcelas futuras</p>` : ''}
            </div>` : `<p class="text-xs text-aura-muted">Defina o limite (✎) para acompanhar o uso.</p>`}

            <!-- Lançamentos -->
            ${fat.itens.length > 0 ? `
            <div class="mt-4 pt-4 border-t border-aura-line">
              <button data-toggle="itens-${c.id}" class="w-full text-center text-xs text-aura-primary font-semibold py-1">Ver lançamentos (${fat.itens.length})</button>
              <div id="itens-${c.id}" class="hidden space-y-1 mt-2">
                ${fat.itens.sort((x, y) => y.data.localeCompare(x.data)).map(t => `
                  <div class="flex justify-between text-xs py-1.5 border-b border-aura-line last:border-0">
                    <span class="truncate pr-2 text-aura-muted">${fmtData(t.data)} · ${esc(t.descricao || (t._ehEstorno ? 'Estorno' : 'Compra'))}${t._ehEstorno ? ' <span style="color:#0B6B53;font-weight:600">[estorno]</span>' : ''}</span>
                    <span class="font-semibold whitespace-nowrap ${t._ehEstorno ? '' : ''}" style="${t._ehEstorno ? 'color:#0B6B53' : ''}">${t._ehEstorno ? '−' : ''}${fmt(t.valor)}</span>
                  </div>`).join('')}
              </div>
            </div>` : ''}

            <!-- Fechar fatura (manual) -->

function faturasMesHtml() {
  const ref = state.mesFaturas;
  const idx = ref.getFullYear() * 12 + ref.getMonth();
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const ehHoje = ref.getFullYear() === new Date().getFullYear() && ref.getMonth() === new Date().getMonth();
  let totalMes = 0, faltaMes = 0;

  const linhas = state.cartoes.map(c => {
    const { faturas, abertaIdx } = calcularFaturas(c);
    const fat = faturas[idx] || { total: 0, pago: 0, itens: [] };
    const restante = Math.max(fat.total - fat.pago, 0);
    const vencStr = dataVencimento(c, idx);
    const status = fat.total > 0 && restante < 0.005 ? 'Paga'
      : vencStr < hojeISO() && restante > 0.005 ? 'Vencida'
      : idx < abertaIdx ? 'Fechada'
      : idx === abertaIdx ? 'Aberta' : 'Futura';
    const cor = status === 'Vencida' ? 'text-aura-danger' : status === 'Paga' ? 'text-aura-green' : 'text-aura-muted';
    totalMes += fat.total;
    faltaMes += restante;
    return `
      <div class="bg-white rounded-xl px-4 py-3 card">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <p class="font-medium text-sm">${esc(c.nome)}</p>
            <p class="text-xs text-aura-muted">Vence em ${fmtData(vencStr)} · <span class="font-semibold ${cor}">${status}</span></p>
          </div>
          <div class="text-right shrink-0">
            <p class="font-semibold text-sm">${fmt(fat.total)}</p>
            ${fat.pago > 0 ? `<p class="text-xs text-aura-green">Pago: ${fmt(fat.pago)}${restante > 0.005 ? ` · Falta: ${fmt(restante)}` : ''}</p>` : ''}
          </div>
        </div>
        ${fat.itens.length > 0 ? `
        <button data-toggle-fmes="fmes-itens-${c.id}" class="w-full text-center text-xs text-aura-muted font-semibold pt-3">Ver lançamentos (${fat.itens.length})</button>
        <div id="fmes-itens-${c.id}" class="hidden space-y-1 mt-2">
          ${[...fat.itens].sort((x, y) => y.data.localeCompare(x.data)).map(t => `
            <div class="flex justify-between gap-2 text-xs py-1 border-b border-aura-line last:border-0">
              <span class="truncate">${fmtData(t.data)} · ${esc(t.descricao || (t._ehEstorno ? 'Estorno' : 'Compra no cartão'))}${t._ehEstorno ? ' <span class="text-aura-green font-semibold">[estorno]</span>' : ''}</span>
              <span class="font-medium whitespace-nowrap ${t._ehEstorno ? 'text-aura-green' : ''}">${t._ehEstorno ? '−' : ''}${fmt(t.valor)}</span>
            </div>`).join('')}
        </div>` : `<p class="text-xs text-aura-muted mt-2">Sem lançamentos nesta fatura.</p>`}
      </div>`;
  }).join('');

  return `
    <div class="flex items-center justify-between md:justify-center gap-4 bg-white rounded-2xl px-4 py-2 card mb-3">
      <button data-fmes="-1" class="text-aura-muted text-lg px-4 py-1 md:px-2 md:py-0">←</button>
      <div class="text-center">
        <p class="text-sm font-semibold">${meses[ref.getMonth()]} de ${ref.getFullYear()}</p>
        ${!ehHoje ? `<button data-fmes="0" class="text-xs text-aura-primary font-semibold">Voltar para hoje</button>` : ''}
      </div>
      <button data-fmes="1" class="text-aura-muted text-lg px-4 py-1 md:px-2 md:py-0">→</button>
    </div>
    <p class="text-xs text-aura-muted mb-3">Faturas que vencem neste mês: ${fmt(totalMes)}${faltaMes > 0.005 ? ` · Falta pagar ${fmt(faltaMes)}` : ''}</p>
    <div class="space-y-3 md:grid md:grid-cols-2 md:gap-3 md:space-y-0">${linhas}</div>`;
}

function gruposParcelamento() {
  const grupos = {};
  state.cartoes.forEach(c => {
    const { faturas } = calcularFaturas(c);
    const travas = travasDoCartao(c);
    state.transacoesCartao
      .filter(t => t.tipo === 'saida' && t.cartao_id === c.id && t.serie_id && Number(t.total_parcelas) > 1)
      .forEach(t => {
        const f = faturas[faturaDaTransacao(c, travas, t)];
        const paga = !!f && f.total - f.pago < 0.005;
        const g = grupos[t.serie_id] = grupos[t.serie_id] || {
          id: t.serie_id, cartao: c, n: Number(t.total_parcelas), total: 0, pago: 0, parcelas: [],
          nome: (t.descricao || 'Compra').replace(/\s*\(\d+\/\d+\)\s*$/, ''),
        };
        g.total += Number(t.valor);
        if (paga) g.pago += Number(t.valor);
        g.parcelas.push({ ...t, paga });
      });
  });
  return Object.values(grupos).map(g => {
    g.parcelas.sort((a, b) => a.data.localeCompare(b.data));
    g.qtdPagas = g.parcelas.filter(x => x.paga).length;
    g.ultima = g.parcelas[g.parcelas.length - 1].data;
    g.finalizado = g.qtdPagas >= g.parcelas.length;
    return g;
  });
}

function parcelamentosHtml() {
  const todos = gruposParcelamento();
  const andamento = todos.filter(g => !g.finalizado);
  const finalizadas = todos.filter(g => g.finalizado);
  const lista = state.parcTab === 'finalizadas' ? finalizadas : andamento;
  const totalA = andamento.reduce((x, g) => x + g.total, 0);
  const pagoA = andamento.reduce((x, g) => x + g.pago, 0);
  const pct = totalA > 0 ? Math.round(pagoA / totalA * 100) : 0;
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const ultima = andamento.map(g => g.ultima).sort().pop();
  const aba = (id, rot, n) => `<button data-parc-tab="${id}" class="text-xs font-semibold px-3 py-2 rounded-full ${state.parcTab === id ? 'bg-aura-primary text-white' : 'text-aura-muted'}">${rot} (${n})</button>`;

  return `
    <div class="bg-white rounded-xl p-4 card mb-3">
      <div class="grid grid-cols-3 gap-3">
        <div><p class="text-[11px] text-aura-muted">EM ANDAMENTO</p><p class="text-lg font-bold">${andamento.length}</p></div>
        <div><p class="text-[11px] text-aura-muted">JÁ PAGO</p><p class="text-sm font-bold text-aura-green">${fmt(pagoA)}</p></div>
        <div><p class="text-[11px] text-aura-muted">RESTANTE</p><p class="text-sm font-bold" style="color:#E0A030">${fmt(totalA - pagoA)}</p></div>
      </div>
      <div class="flex justify-between text-xs text-aura-muted mt-3 mb-1"><span>Valor total ${fmt(totalA)}</span><span>${pct}% pago</span></div>
      <div class="rounded-full overflow-hidden" style="height:8px;background:#E2E7E1"><div class="h-full rounded-full" style="width:${pct}%;background:var(--color-primary)"></div></div>
      ${ultima ? `<p class="text-xs text-aura-muted mt-3">Última parcela: <span class="font-semibold text-aura-ink">${meses[Number(ultima.slice(5, 7)) - 1]} de ${ultima.slice(0, 4)}</span></p>` : ''}
    </div>
    <div class="flex gap-2 mb-3">${aba('andamento', 'Em andamento', andamento.length)}${aba('finalizadas', 'Finalizadas', finalizadas.length)}</div>
    <div class="space-y-2">
      ${lista.length === 0 ? `<p class="text-aura-muted text-sm py-4 text-center">Nenhum parcelamento ${state.parcTab === 'finalizadas' ? 'finalizado' : 'em andamento'}.</p>` : lista.map(g => {
        const p = g.total > 0 ? g.pago / g.total * 100 : 0;
        return `
        <div class="bg-white rounded-xl px-4 py-3 card">
          <button data-toggle-parc="parc-${g.id}" class="w-full text-left">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <p class="font-medium text-sm truncate">${esc(g.nome)}</p>
                <p class="text-xs text-aura-muted">${g.qtdPagas}/${g.n}x · ${fmt(g.total / g.n)}/mês · ${esc(g.cartao.nome)}</p>
              </div>
              <div class="text-right shrink-0">
                <p class="font-semibold text-sm">${fmt(g.total - g.pago)}</p>
                <p class="text-[11px] text-aura-muted">restante</p>
              </div>
            </div>
            <div class="rounded-full overflow-hidden mt-2" style="height:6px;background:#E2E7E1"><div class="h-full rounded-full" style="width:${p}%;background:var(--color-primary)"></div></div>
          </button>
          <div id="parc-${g.id}" class="hidden mt-3 space-y-1">
            ${g.parcelas.map(x => `
              <div class="flex justify-between text-xs py-1 border-b border-aura-line last:border-0">
                <span>${x.parcela_atual}/${g.n} · ${fmtData(x.data)}</span>
                <span class="${x.paga ? 'text-aura-green' : 'text-aura-muted'}">${fmt(x.valor)} ${x.paga ? '✓' : ''}</span>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')}

}

function bindParcelamentos() {
  const raiz = document.getElementById('parcelamentos');
  if (!raiz) return;
  raiz.querySelectorAll('[data-parc-tab]').forEach(btn => {
    btn.onclick = () => { state.parcTab = btn.dataset.parcTab; raiz.innerHTML = parcelamentosHtml(); bindParcelamentos(); };
  });
  raiz.querySelectorAll('[data-toggle-parc]').forEach(btn => {
    btn.onclick = () => document.getElementById(btn.dataset.toggleParc)?.classList.toggle('hidden');
  });
}

function bindFaturasMes() {
  const raiz = document.getElementById('faturas-mes');
  if (!raiz) return;
  raiz.querySelectorAll('[data-fmes]').forEach(btn => {
    btn.onclick = () => {
      const delta = Number(btn.dataset.fmes);
      const r = state.mesFaturas;
      state.mesFaturas = delta === 0 ? primeiroDiaDoMes() : new Date(r.getFullYear(), r.getMonth() + delta, 1);
      raiz.innerHTML = faturasMesHtml();
      bindFaturasMes();
    };
  });
  raiz.querySelectorAll('[data-toggle-fmes]').forEach(btn => {
    btn.onclick = () => document.getElementById(btn.dataset.toggleFmes)?.classList.toggle('hidden');

}

const TIPOS_RESERVA = ['Reserva de Emergência', 'Renda Fixa', 'Renda Variável', 'Bens de Patrimônio', 'Dívidas'];
const valInv = (i) => Number(i.valor_atual || i.valor_aplicado || 0);
const somaInv = (arr) => arr.reduce((s, i) => s + valInv(i), 0);

function linhaInv(i) {
  const at = valInv(i);
  const r = at - Number(i.valor_aplicado || 0);
  return `
    <div class="flex items-center justify-between gap-3 py-3 border-t border-aura-line first:border-0">
      <div class="min-w-0"><p class="text-sm font-medium break-words">${esc(i.ativo)}</p><p class="text-xs text-aura-muted">${esc(i.tipo || '—')} · ${fmtData(i.data_aplicacao)}</p></div>
      <div class="flex items-center gap-3 shrink-0">
        <div class="text-right"><p class="text-sm font-semibold">${fmt(at)}</p>
          <p class="text-xs ${r >= 0 ? 'text-aura-green' : 'text-aura-danger'}">${r >= 0 ? '+' : ''}${fmt(r)}</p></div>
        <button data-edit-invest="${i.id}" class="text-aura-muted text-xs">✎</button>
        <button data-del-invest="${i.id}" class="text-aura-muted text-xs">✕</button>
      </div>
    </div>`;
}

function viewReserva() {
  const gastoPlan = state.orcamentos
    .filter(o => state.categorias.find(c => c.id === o.categoria_id)?.tipo === 'saida')
    .reduce((s, o) => s + Number(o.valor_limite), 0);
  const meses = state.reservaMeses;
  const meta = gastoPlan * meses;
  const itens = state.investimentos.filter(i => i.tipo === 'Reserva de Emergência');
  const atual = somaInv(itens);
  const protegido = meta > 0 && atual >= meta;
  const pct = meta > 0 ? Math.min(100, Math.round((atual / meta) * 100)) : 0;
  const cor = protegido ? '#3B6FD4' : '#B9C4BD';

  return `
    <div class="md:grid md:grid-cols-2 md:gap-5">
      <div class="bg-white rounded-2xl p-6 card flex flex-col items-center justify-center text-center mb-5 md:mb-0 min-h-[320px]">
        <p class="text-xs font-bold tracking-widest ${protegido ? 'text-blue-600' : 'text-aura-muted'} mb-5">
          ${protegido ? 'PARABÉNS, VOCÊ ESTÁ 100% PROTEGIDO' : meta > 0 ? `SUA RESERVA COBRE ${pct}% DA META` : 'DEFINA SEU PLANEJAMENTO'}
        </p>
        <svg viewBox="0 0 100 104" class="w-44 h-44">
          <path d="M50 6 L90 21 V52 C90 75 72 90 50 98 C28 90 10 75 10 52 V21 Z" fill="${cor}"/>
          ${protegido ? '<circle cx="50" cy="50" r="17" fill="#fff" opacity=".9"/><path d="M41 50 l7 7 l13 -14" stroke="#3B6FD4" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
                      : `<text x="50" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">${pct}%</text>`}
        </svg>
        <p class="text-sm text-aura-muted mt-5">${protegido ? 'Reserva completa. Respira fundo.' : meta > 0 ? `Faltam ${fmt(meta - atual)} para a meta.` : 'Defina o orçamento das suas despesas para calcular a reserva.'}</p>

          </div>
          ${itens.length ? itens.map(linhaInv).join('') : '<p class="text-sm text-aura-muted py-4 text-center">Nenhum valor na reserva ainda.</p>'}

            <p class="text-xs text-aura-muted tracking-wide">RESERVA ATUAL</p>
            <p class="text-3xl font-extrabold ${protegido ? 'text-blue-600' : ''}">${fmt(atual)}</p>
