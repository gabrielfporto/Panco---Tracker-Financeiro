<script>
// ---------- Config ----------
const SUPABASE_URL = 'https://nkjfuagdrtsdtqdcdoti.supabase.co';
const SUPABASE_KEY = 'sb_publishable_f5cL0Y8XdNbMnDKOfxeWLQ_8UC9jnYS';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById('app');
const fmt = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtData = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR') : '—';
const monthName = () => {
  const d = state.mesRef;
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return `${meses[d.getMonth()]} de ${d.getFullYear()}`;
};
const addMonths = (dataStr, n) => {
  const d = new Date(dataStr + 'T00:00:00');
  const dia = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const ultimoDiaMes = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dia, ultimoDiaMes));
  return d.toISOString().slice(0, 10);
};
const nomeExibicao = () => {
  const meta = state.user?.user_metadata?.full_name;
  if (meta) return meta;
  const email = state.user?.email || 'você';
  const prefix = email.split('@')[0];
  return prefix.charAt(0).toUpperCase() + prefix.slice(1);
};

const CATEGORIAS_PADRAO_ENTRADA = ['Mesada', 'Prestação de Serviços', 'Ressarcimentos', 'Inquilino', 'Outros ganhos'];
const CATEGORIAS_PADRAO_SAIDA = ['Aluguel', 'Farmácia', 'Contas Residenciais', 'Mercado', 'Transporte', 'Cuidados Pessoais', 'Saúde', 'Imprevistos', 'Roupas', 'Compras', 'Lazer', 'Assinaturas', 'Presentes', 'Manutenção do Carro'];

let state = {
  user: null,
  view: 'inicio',
  previousView: 'inicio',
  mesRef: (() => { const d = new Date(); d.setDate(1); return d; })(),
  transacoes: [],
  transacoesCartao: [],
  categorias: [],
  cartoes: [],
  metas: [],
  investimentos: [],
  orcamentos: [],
  fechamentos: [],
  pagamentosCartao: [],
  saldoAtualTotal: 0,
  editandoCartaoId: null,
  editandoInvestimentoId: null,
};

// ---------- Boot ----------
async function render() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { state.user = null; renderLogin(); return; }
  state.user = session.user;
  await loadAll();
  state.view = 'inicio';
  renderApp();
}

// ---------- Login ----------
function renderLogin() {
  app.innerHTML = `
    <div class="flex-1 flex flex-col justify-center px-8 py-12 max-w-sm mx-auto w-full">
      <h1 class="text-3xl font-bold mb-1">Panco</h1>
      <p class="text-aura-muted mb-8">Suas finanças, num só lugar.</p>

      <div class="space-y-3">
        <input id="email" type="email" placeholder="E-mail"
          class="w-full rounded-xl border border-aura-line bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary" />
        <input id="password" type="password" placeholder="Senha"
          class="w-full rounded-xl border border-aura-line bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary" />
      </div>

      <p id="error" class="text-aura-danger text-sm mt-3 hidden"></p>

      <button id="btn-login"
        class="w-full mt-6 rounded-xl bg-aura-primary text-white font-semibold py-3 active:bg-aura-primarydark transition">
        Entrar
      </button>
      <button id="btn-signup"
        class="w-full mt-2 rounded-xl border border-aura-line text-aura-ink font-medium py-3">
        Criar conta
      </button>
    </div>
  `;

  const showError = (msg) => {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.classList.remove('hidden');
  };

  document.getElementById('btn-login').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return showError(error.message);
    render();
  };

  document.getElementById('btn-signup').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || password.length < 6) return showError('Preencha e-mail e senha (mín. 6 caracteres).');
    const { error } = await sb.auth.signUp({ email, password });
    if (error) return showError(error.message);
    showError('Conta criada. Se pedir confirmação por e-mail, confirme e depois clique em Entrar.');
  };
}

// ---------- Categorias padrão ----------
async function seedCategoriasPadrao() {
  const rows = [
    ...CATEGORIAS_PADRAO_ENTRADA.map(nome => ({ user_id: state.user.id, nome, tipo: 'entrada' })),
    ...CATEGORIAS_PADRAO_SAIDA.map(nome => ({ user_id: state.user.id, nome, tipo: 'saida' })),
  ];
  await sb.from('categorias').insert(rows);
  const { data } = await sb.from('categorias').select('*').order('nome');
  state.categorias = data || [];
}

// ---------- Data ----------
async function loadAll() {
  const inicioStr = state.mesRef.toISOString().slice(0, 10);
  const fimStr = addMonths(inicioStr, 1);
  const hojeStr = new Date().toISOString().slice(0, 10);

  const [transacoesRes, categoriasRes, cartoesRes, metasRes, investimentosRes, orcamentosRes, fechamentosRes, pagamentosRes, transacoesCartaoRes, totalRes] = await Promise.all([
    sb.from('transacoes').select('*, categorias(nome, cor)').gte('data', inicioStr).lt('data', fimStr).order('data', { ascending: false }),
    sb.from('categorias').select('*').order('nome'),
    sb.from('cartoes').select('*').order('nome'),
    sb.from('metas').select('*').order('prazo', { ascending: true }),
    sb.from('investimentos').select('*').order('data_aplicacao', { ascending: false }),
    sb.from('orcamentos').select('*'),
    sb.from('fechamentos_fatura').select('*').order('data_fechamento', { ascending: false }),
    sb.from('pagamentos_cartao').select('*'),
    sb.from('transacoes').select('id, valor, tipo, data, cartao_id').not('cartao_id', 'is', null),
    sb.from('transacoes').select('tipo, valor, metodo_pagamento').lte('data', hojeStr),
  ]);

  state.transacoes = transacoesRes.data || [];
  state.categorias = categoriasRes.data || [];
  state.cartoes = cartoesRes.data || [];
  state.metas = metasRes.data || [];
  state.investimentos = investimentosRes.data || [];
  state.orcamentos = orcamentosRes.data || [];
  state.fechamentos = fechamentosRes.data || [];
  state.pagamentosCartao = pagamentosRes.data || [];
  state.transacoesCartao = transacoesCartaoRes.data || [];

  // Saldo bancário real: só até hoje, e ignora transações pagas no cartão (isso é fatura, não saída de conta)
  const todas = (totalRes.data || []).filter(t => t.metodo_pagamento !== 'Cartão');
  state.saldoAtualTotal = todas.reduce((s, t) => s + (t.tipo === 'entrada' ? Number(t.valor) : -Number(t.valor)), 0);

  if (state.categorias.length === 0) {
    await seedCategoriasPadrao();
  }
}

function getUltimoFechamento(cartaoId) {
  const doCartao = state.fechamentos.filter(f => f.cartao_id === cartaoId);
  if (doCartao.length === 0) return null;
  return doCartao.reduce((max, f) => (f.data_fechamento > max ? f.data_fechamento : max), doCartao[0].data_fechamento);
}

function setView(view) {
  state.view = view;
  renderApp();
}

function irParaNovaTransacao() {
  state.previousView = state.view;
  setView('nova-transacao');
}

function ehMesAtual() {
  const hoje = new Date();
  return state.mesRef.getMonth() === hoje.getMonth() && state.mesRef.getFullYear() === hoje.getFullYear();
}

function seletorMes() {
  return `
    <div class="flex items-center justify-center gap-4 mb-5 bg-white rounded-xl px-4 py-2 card md:max-w-md">
      <button data-mes="-1" class="text-aura-muted text-lg px-2">←</button>
      <div class="text-center">
        <p class="text-sm font-semibold">${monthName()}</p>
        ${!ehMesAtual() ? `<button data-mes="0" class="text-xs text-aura-primary font-semibold">Voltar para hoje</button>` : ''}
      </div>
      <button data-mes="1" class="text-aura-muted text-lg px-2">→</button>
    </div>
  `;
}

// ---------- Shell ----------
function renderApp() {
  const views = {
    inicio: viewInicio,
    transacoes: viewTransacoes,
    'nova-transacao': viewNovaTransacao,
    cartoes: viewCartoes,
    metas: viewMetas,
    investimentos: viewInvestimentos,
    planejamento: viewPlanejamento,
    ia: viewIA,
  };
  const contentHtml = (views[state.view] || viewInicio)();

  const navItems = [
    { view: 'inicio', label: 'Início' },
    { view: 'transacoes', label: 'Trans.' },
    { view: 'cartoes', label: 'Cartões' },
    { view: 'planejamento', label: 'Planej.' },
    { view: 'investimentos', label: 'Invest.' },
    { view: 'metas', label: 'Metas' },
    { view: 'ia', label: 'IA' },
  ];
  const topLevel = ['inicio', 'transacoes', 'cartoes', 'planejamento', 'investimentos', 'metas', 'ia'].includes(state.view)
    ? state.view : 'inicio';

  app.innerHTML = `
    <div class="flex-1 overflow-y-auto pb-24 md:pb-10">
      <div class="hidden md:flex items-center justify-between px-8 py-5 border-b border-aura-line mb-6 bg-white">
        <span class="font-bold text-lg">Panco</span>
        <div class="flex gap-6">
          ${navItems.map(n => `
            <button data-nav="${n.view}" class="navbtn text-sm font-medium ${n.view === topLevel ? 'active' : ''}">${n.label}</button>
          `).join('')}
        </div>
        <button id="btn-logout-desktop" class="text-xs text-aura-muted underline">Sair</button>
      </div>
      <div class="md:px-8">${contentHtml}</div>
    </div>
    <nav class="md:hidden max-w-md mx-auto fixed bottom-0 left-0 right-0 bg-white border-t border-aura-line px-2 py-2 flex justify-between">
      ${navItems.map(n => `
        <button data-nav="${n.view}" class="navbtn flex flex-col items-center text-xs font-medium px-1 ${n.view === topLevel ? 'active' : ''}">
          ${n.label}
        </button>
      `).join('')}
    </nav>
  `;

  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.onclick = () => setView(btn.dataset.nav);
  });

  document.getElementById('btn-logout-desktop')?.addEventListener('click', async () => {
    await sb.auth.signOut();
    render();
  });

  bindViewEvents();
}

// ---------- Início ----------
function viewInicio() {
  const naoCartao = (t) => t.metodo_pagamento !== 'Cartão';
  const entradasMes = state.transacoes.filter(t => t.tipo === 'entrada' && naoCartao(t)).reduce((s, t) => s + Number(t.valor), 0);
  const saidasMes = state.transacoes.filter(t => t.tipo === 'saida' && naoCartao(t)).reduce((s, t) => s + Number(t.valor), 0);
  const saldoMes = entradasMes - saidasMes;
  const saldoAtual = state.saldoAtualTotal;

  const rendaEsperadaTotal = state.orcamentos
    .filter(o => state.categorias.find(c => c.id === o.categoria_id)?.tipo === 'entrada')
    .reduce((s, o) => s + Number(o.valor_limite), 0);
  const despesaOrcadaTotal = state.orcamentos
    .filter(o => state.categorias.find(c => c.id === o.categoria_id)?.tipo === 'saida')
    .reduce((s, o) => s + Number(o.valor_limite), 0);

  let saldoPrevisto;
  let previsaoBaseadaEmPlano = rendaEsperadaTotal > 0 || despesaOrcadaTotal > 0;
  if (previsaoBaseadaEmPlano) {
    const rendaQueFalta = Math.max(rendaEsperadaTotal - entradasMes, 0);
    const despesaQueFalta = Math.max(despesaOrcadaTotal - saidasMes, 0);
    saldoPrevisto = saldoAtual + rendaQueFalta - despesaQueFalta;
  } else {
    const hoje = new Date();
    const diaAtual = hoje.getDate();
    const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
    const diasRestantes = Math.max(diasNoMes - diaAtual, 0);
    const mediaDiaria = saldoMes / Math.max(diaAtual, 1);
    saldoPrevisto = saldoAtual + mediaDiaria * diasRestantes;
  }

  const porCartao = {};
  state.cartoes.forEach(c => { porCartao[c.id] = { nome: c.nome, total: 0 }; });
  state.transacoes.filter(t => t.tipo === 'saida' && t.cartao_id).forEach(t => {
    if (porCartao[t.cartao_id]) porCartao[t.cartao_id].total += Number(t.valor);
  });
  const gastosCartoesMes = Object.values(porCartao).reduce((s, c) => s + c.total, 0);

  const recentes = state.transacoes.slice(0, 5);

  return `
    <div class="px-5 pt-8 md:px-0 md:pt-0">
      <div class="flex items-start justify-between mb-6">
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-2xl font-bold leading-tight">Olá, ${nomeExibicao()}</h1>
            <button id="btn-edit-nome" class="text-aura-muted text-sm" title="Editar nome">✎</button>
          </div>
          <p class="text-aura-muted text-sm">Visão geral</p>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <button data-nova-transacao class="text-xs text-white bg-aura-primary rounded-full px-3 py-2 font-semibold whitespace-nowrap">+ Nova</button>
          <button id="btn-logout" class="md:hidden text-xs text-aura-muted underline">Sair</button>
        </div>
      </div>

      ${seletorMes()}

      <div class="md:grid md:grid-cols-3 md:gap-6">
        <div class="md:col-span-2 space-y-6">
          <div class="rounded-2xl bg-aura-primary text-white p-6 card">
            <div class="flex items-center justify-between mb-4">
              <span class="text-sm text-white/80">Saldo do mês (conta bancária)</span>
              <span class="text-xs bg-white/15 rounded-full px-3 py-1">${saldoMes >= 0 ? 'No verde' : 'No vermelho'}</span>
            </div>
            <p class="text-4xl font-extrabold mb-5">${fmt(saldoMes)}</p>
            <div class="flex gap-8">
              <div>
                <p class="text-xs text-white/70">ENTRADAS</p>
                <p class="font-semibold">${fmt(entradasMes)}</p>
              </div>
              <div>
                <p class="text-xs text-white/70">SAÍDAS</p>
                <p class="font-semibold">${fmt(saidasMes)}</p>
              </div>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-3">
              <h2 class="font-semibold">Últimas transações</h2>
              <button data-nav-inline="transacoes" class="text-sm text-aura-primary font-semibold">Ver todas</button>
            </div>
            <div class="space-y-2">
              ${recentes.length === 0
                ? `<p class="text-aura-muted text-sm py-6 text-center">Nenhuma transação este mês ainda.</p>`
                : recentes.map(rowTransacao).join('')}
            </div>
          </div>
        </div>

        <div class="md:col-span-1 space-y-4 mt-6 md:mt-0">
          <div class="bg-white rounded-xl p-4 card">
            <p class="text-xs text-aura-muted mb-1">SALDO ATUAL</p>
            <p class="text-xl font-bold">${fmt(saldoAtual)}</p>
          </div>
          <div class="bg-white rounded-xl p-4 card">
            <p class="text-xs text-aura-muted mb-1">SALDO PREVISTO (fim do mês)</p>
            <p class="text-xl font-bold">${fmt(saldoPrevisto)}</p>
            <p class="text-xs text-aura-muted mt-2">${previsaoBaseadaEmPlano ? 'Baseado na renda esperada e no orçamento definidos no Planejamento' : 'Estimativa com base no ritmo de gastos deste mês (defina o planejamento para uma previsão mais precisa)'}</p>
          </div>
          <div class="bg-white rounded-xl p-4 card">
            <p class="text-xs text-aura-muted mb-1">GASTO NOS CARTÕES (mês)</p>
            <p class="text-xl font-bold mb-2">${fmt(gastosCartoesMes)}</p>
            ${Object.values(porCartao).filter(c => c.total > 0).map(c => `
              <div class="flex justify-between text-xs text-aura-muted mt-1">
                <span>${c.nome}</span><span>${fmt(c.total)}</span>
              </div>
            `).join('') || `<p class="text-xs text-aura-muted">Nenhum gasto em cartão este mês.</p>`}
          </div>
        </div>
      </div>
    </div>
  `;
}

function rowTransacao(t) {
  return `
    <div class="flex items-center justify-between bg-white rounded-xl px-4 py-3 card">
      <div>
        <p class="font-medium text-sm">${t.descricao || t.categorias?.nome || 'Transação'}</p>
        <p class="text-xs text-aura-muted">${fmtData(t.data)}${t.categorias?.nome ? ' · ' + t.categorias.nome : ''}${t.metodo_pagamento ? ' · ' + t.metodo_pagamento : ''}${t.serie_id ? ' · série ↻' : ''}</p>
      </div>
      <div class="flex items-center gap-3">
        <p class="font-semibold text-sm ${t.tipo === 'entrada' ? 'text-aura-primary' : 'text-aura-danger'}">
          ${t.tipo === 'entrada' ? '+' : '-'} ${fmt(Math.abs(t.valor))}
        </p>
        ${t.serie_id ? `<button data-edit-serie="${t.id}" class="text-aura-muted text-xs">✎</button>` : ''}
        <button data-del-transacao="${t.id}" class="text-aura-muted text-xs">✕</button>
      </div>
    </div>
  `;
}

// ---------- Transações ----------
function viewTransacoes() {
  return `
    <div class="px-5 pt-8 md:px-0 md:pt-0">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold">Transações</h1>
        <button data-nova-transacao class="text-sm text-white bg-aura-primary rounded-full px-4 py-2 font-semibold">+ Nova</button>
      </div>
      ${seletorMes()}
      <div class="space-y-2">
        ${state.transacoes.length === 0
          ? `<p class="text-aura-muted text-sm py-6 text-center">Nenhuma transação este mês ainda.</p>`
          : state.transacoes.map(rowTransacao).join('')}
      </div>
    </div>
  `;
}

// ---------- Nova transação ----------
function viewNovaTransacao() {
  const categoriasOptions = (tipo) => state.categorias
    .filter(c => c.tipo === tipo)
    .map(c => `<option value="${c.id}">${c.nome}</option>`)
    .join('');

  const cartoesOptions = state.cartoes
    .map(c => `<option value="${c.id}">${c.nome}</option>`)
    .join('');

  return `
    <div class="px-5 pt-8 md:px-0 md:pt-0 md:max-w-md">
      <button data-nav-inline="${state.previousView}" class="text-sm text-aura-muted mb-6">← Voltar</button>
      <h1 class="text-xl font-bold mb-6">Nova transação</h1>

      <div class="space-y-3">
        <div class="flex rounded-xl overflow-hidden border border-aura-line">
          <button data-tipo="entrada" class="tipo-btn flex-1 py-3 text-sm font-medium bg-aura-tint text-aura-primary">Entrada</button>
          <button data-tipo="saida" class="tipo-btn flex-1 py-3 text-sm font-medium bg-white text-aura-muted">Saída</button>
        </div>
        <input id="descricao" placeholder="Descrição"
          class="w-full rounded-xl border border-aura-line bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary" />
        <input id="valor" type="number" step="0.01" placeholder="Valor (ex: 150.00)"
          class="w-full rounded-xl border border-aura-line bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary" />
        <input id="data" type="date"
          class="w-full rounded-xl border border-aura-line bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary" />

        <select id="categoria" class="w-full rounded-xl border border-aura-line bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary">

// ---------- Planejamento ----------
function viewPlanejamento() {
  const gastoPorCategoria = {};
  state.transacoes.filter(t => t.tipo === 'saida').forEach(t => {
    const key = t.categoria_id || 'sem-categoria';
    gastoPorCategoria[key] = (gastoPorCategoria[key] || 0) + Number(t.valor);
  });

  const recebidoPorCategoria = {};
  state.transacoes.filter(t => t.tipo === 'entrada').forEach(t => {
    const key = t.categoria_id || 'sem-categoria';
    recebidoPorCategoria[key] = (recebidoPorCategoria[key] || 0) + Number(t.valor);
  });

  const limitePorCategoria = {};
  state.orcamentos.forEach(o => { limitePorCategoria[o.categoria_id] = Number(o.valor_limite); });

  const categoriasSaida = state.categorias.filter(c => c.tipo === 'saida');
  const categoriasEntrada = state.categorias.filter(c => c.tipo === 'entrada');

  const totalGasto = Object.values(gastoPorCategoria).reduce((s, v) => s + v, 0);
  const totalOrcado = state.orcamentos
    .filter(o => state.categorias.find(c => c.id === o.categoria_id)?.tipo === 'saida')
    .reduce((s, o) => s + Number(o.valor_limite), 0);

  const totalRecebido = Object.values(recebidoPorCategoria).reduce((s, v) => s + v, 0);
  const totalEsperado = state.orcamentos
    .filter(o => state.categorias.find(c => c.id === o.categoria_id)?.tipo === 'entrada')
    .reduce((s, o) => s + Number(o.valor_limite), 0);

  const linhaCategoria = (c, gasto, tipo) => {
    const limite = limitePorCategoria[c.id];
    const pct = limite ? Math.min(100, Math.round((gasto / limite) * 100)) : 0;
    const estourou = tipo === 'saida' && limite && gasto > limite;
    const corBarra = estourou ? 'bg-aura-danger' : 'bg-aura-primary';
    const rotulo = tipo === 'entrada' ? 'Recebido' : 'Gasto';
    return `
      <div class="bg-white rounded-xl p-4 card">
        <div class="flex items-center justify-between mb-2">
          <p class="font-medium text-sm">${c.nome}</p>
          <div class="flex items-center gap-2">
            <button data-def-orcamento="${c.id}" class="text-xs text-aura-primary font-semibold">${limite ? 'Editar' : '+ Definir'}</button>
            <button data-del-categoria="${c.id}" class="text-aura-muted text-xs">✕</button>
          </div>
        </div>
        ${limite ? `
          <div class="w-full bg-aura-tint rounded-full h-2 mb-2">
            <div class="${corBarra} h-2 rounded-full" style="width:${pct}%"></div>
          </div>
          <div class="flex items-center justify-between text-xs text-aura-muted">
            <span>${fmt(gasto)} de ${fmt(limite)}</span>
            <span class="${estourou ? 'text-aura-danger font-semibold' : ''}">${pct}%${estourou ? ' · estourou' : ''}</span>
          </div>
        ` : `
          <p class="text-xs text-aura-muted">${rotulo} no mês: ${fmt(gasto)} · sem orçamento definido</p>
        `}
      </div>
    `;
  };

  return `
    <div class="px-5 pt-8 md:px-0 md:pt-0">
      <div class="flex items-center justify-between mb-1">
        <h1 class="text-xl font-bold">Planejamento</h1>
        <button data-toggle="form-categoria" class="text-sm text-white bg-aura-primary rounded-full px-4 py-2 font-semibold">+ Categoria</button>
      </div>
      <p class="text-aura-muted text-sm mb-4">Defina um orçamento mensal por categoria e acompanhe entradas e saídas</p>

      ${seletorMes()}

      <div id="form-categoria" class="hidden mb-6 bg-white rounded-xl p-4 card space-y-3 md:max-w-md">
        <p class="text-sm font-semibold">Nova categoria</p>
        <input id="cat-nome" placeholder="Nome da categoria"
          class="w-full rounded-xl border border-aura-line px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary" />
        <select id="cat-tipo" class="w-full rounded-xl border border-aura-line bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-aura-primary">
          <option value="saida">Saída</option>
          <option value="entrada">Entrada</option>
        </select>
        <p id="cat-erro" class="text-aura-danger text-sm hidden"></p>
        <button id="cat-salvar" class="w-full rounded-xl bg-aura-primary text-white font-semibold py-3">Salvar categoria</button>
      </div>

      <div class="rounded-2xl bg-aura-primary text-white p-5 card mb-4 md:max-w-md">
        <p class="text-xs text-white/70">GASTO TOTAL DO MÊS</p>
        <p class="text-2xl font-extrabold mb-1">${fmt(totalGasto)}</p>
        <p class="text-xs text-white/70">${totalOrcado > 0 ? 'Orçado: ' + fmt(totalOrcado) : 'Nenhuma categoria orçada ainda'}</p>
      </div>

      <h2 class="font-semibold mb-3">Despesas</h2>
      <div class="space-y-3 md:grid md:grid-cols-2 md:gap-3 md:space-y-0 mb-8">
        ${categoriasSaida.length === 0
          ? `<p class="text-aura-muted text-sm py-6 text-center md:col-span-2">Nenhuma categoria de saída cadastrada.</p>`
          : categoriasSaida.map(c => linhaCategoria(c, gastoPorCategoria[c.id] || 0, 'saida')).join('')}
      </div>

      <div class="rounded-2xl bg-aura-tint p-5 card mb-4 md:max-w-md">
        <p class="text-xs text-aura-muted">RENDA RECEBIDA NO MÊS</p>
        <p class="text-2xl font-extrabold mb-1 text-aura-primary">${fmt(totalRecebido)}</p>
        <p class="text-xs text-aura-muted">${totalEsperado > 0 ? 'Esperado: ' + fmt(totalEsperado) : 'Nenhuma renda esperada definida ainda'}</p>
      </div>

      <h2 class="font-semibold mb-3">Entradas</h2>
      <div class="space-y-3 md:grid md:grid-cols-2 md:gap-3 md:space-y-0">
        ${categoriasEntrada.length === 0
          ? `<p class="text-aura-muted text-sm py-6 text-center md:col-span-2">Nenhuma categoria de entrada cadastrada.</p>`
          : categoriasEntrada.map(c => linhaCategoria(c, recebidoPorCategoria[c.id] || 0, 'entrada')).join('')}
      </div>
    </div>
  `;
}

// ---------- Event binding (roda depois de cada renderApp) ----------
function bindViewEvents() {
  document.getElementById('btn-logout')?.addEventListener('click', async () => {
    await sb.auth.signOut();
    render();
  });

  document.querySelectorAll('[data-nav-inline]').forEach(btn => {
    btn.onclick = () => setView(btn.dataset.navInline);
  });

  document.querySelectorAll('[data-mes]').forEach(btn => {
    btn.onclick = async () => {
      const delta = parseInt(btn.dataset.mes);
      if (delta === 0) {
        const hoje = new Date();
        hoje.setDate(1);
        state.mesRef = hoje;
      } else {
        const novo = new Date(state.mesRef);
        novo.setMonth(novo.getMonth() + delta);
        state.mesRef = novo;
      }
      await loadAll();
      renderApp();
    };
  });

  document.querySelectorAll('[data-nova-transacao]').forEach(btn => {
    btn.onclick = irParaNovaTransacao;
  });

  document.getElementById('btn-edit-nome')?.addEventListener('click', async () => {
    const novo = prompt('Como você quer ser chamado?', nomeExibicao());
    if (!novo) return;
    const { data, error } = await sb.auth.updateUser({ data: { full_name: novo } });
    if (!error && data?.user) state.user = data.user;
    renderApp();
  });

  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = () => document.getElementById(btn.dataset.toggle)?.classList.toggle('hidden');
  });

  document.querySelectorAll('[data-novo-cartao]').forEach(btn => {
    btn.onclick = () => {
      state.editandoCartaoId = null;
      document.getElementById('form-cartao')?.classList.toggle('hidden');
    };
  });

  document.querySelectorAll('[data-edit-cartao]').forEach(btn => {
    btn.onclick = () => {
      state.editandoCartaoId = btn.dataset.editCartao;
      renderApp();
    };
  });

  document.querySelectorAll('[data-cancelar-edicao-cartao]').forEach(btn => {
    btn.onclick = () => {
      state.editandoCartaoId = null;
      renderApp();
    };
  });

  document.querySelectorAll('[data-fechar-fatura]').forEach(btn => {
    btn.onclick = async () => {
      const cartao = state.cartoes.find(c => c.id === btn.dataset.fecharFatura);
      if (!confirm(`Fechar a fatura atual do cartão "${cartao?.nome}"? As próximas compras entrarão na próxima fatura.`)) return;
      const { error } = await sb.from('fechamentos_fatura').insert({
        user_id: state.user.id,
        cartao_id: btn.dataset.fecharFatura,
        data_fechamento: new Date().toISOString().slice(0, 10),
      });
      if (error) { alert(error.message); return; }
      await loadAll();
      renderApp();
    };
  });

  const metodoPagamentoEscolha = {};
  document.querySelectorAll('.metodo-pagamento-btn').forEach(btn => {
    const cartaoId = btn.dataset.metodoPagamento;
    if (!(cartaoId in metodoPagamentoEscolha)) metodoPagamentoEscolha[cartaoId] = 'Pix';
    btn.onclick = () => {
      metodoPagamentoEscolha[cartaoId] = btn.dataset.metodo;
      document.querySelectorAll(`.metodo-pagamento-btn[data-metodo-pagamento="${cartaoId}"]`).forEach(b => {
        b.classList.remove('bg-aura-tint', 'text-aura-primary');
        b.classList.add('bg-white', 'text-aura-muted');
      });
      btn.classList.remove('bg-white', 'text-aura-muted');
      btn.classList.add('bg-aura-tint', 'text-aura-primary');
    };
  });

  document.querySelectorAll('[data-pagar-valor-cheio]').forEach(btn => {
    btn.onclick = () => {
      const cartaoId = btn.dataset.pagarValorCheio;
      const input = document.querySelector(`[data-input-pagamento="${cartaoId}"]`);
      if (input) input.value = btn.dataset.valorCheio;
    };
  });

  async function registrarPagamentoFatura(cartaoId, valor, metodo) {
    const cartao = state.cartoes.find(c => c.id === cartaoId);
    const hoje = new Date().toISOString().slice(0, 10);

    const { error: e1 } = await sb.from('pagamentos_cartao').insert({
      user_id: state.user.id,
      cartao_id: cartaoId,
      valor,
      data: hoje,
    });
    if (e1) { alert(e1.message); return false; }

    const { error: e2 } = await sb.from('transacoes').insert({
      user_id: state.user.id,
      descricao: `Pagamento fatura ${cartao?.nome || ''}`.trim(),
      valor,
      tipo: 'saida',
      data: hoje,
      metodo_pagamento: metodo,
    });
    if (e2) { alert(e2.message); return false; }

    return true;
  }

  document.querySelectorAll('[data-confirmar-pagamento]').forEach(btn => {
    btn.onclick = async () => {
      const cartaoId = btn.dataset.confirmarPagamento;
      const input = document.querySelector(`[data-input-pagamento="${cartaoId}"]`);
      const valor = parseFloat(input?.value);

      if (!valor || valor <= 0) {
        alert('Informe um valor válido para o pagamento.');
        return;
      }

      const metodo = metodoPagamentoEscolha[cartaoId] || 'Pix';
      const ok = await registrarPagamentoFatura(cartaoId, valor, metodo);
      if (!ok) return;

      await loadAll();
      renderApp();
    };
  });

  document.querySelectorAll('[data-del-transacao]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.delTransacao;
      const t = state.transacoes.find(x => x.id === id);

      if (t?.serie_id) {
        const escolha = prompt(
          'Essa transação faz parte de uma série (recorrente ou parcelada).\n\n' +
          'Digite o número da opção:\n' +
          '1 = excluir só esta\n' +
          '2 = excluir esta e as futuras da série\n' +
          '3 = excluir a série inteira\n\n' +
          '(qualquer outro valor cancela)'
        );
        if (escolha === '1') {
          await sb.from('transacoes').delete().eq('id', id);
        } else if (escolha === '2') {
          await sb.from('transacoes').delete().eq('serie_id', t.serie_id).gte('data', t.data);
        } else if (escolha === '3') {
          await sb.from('transacoes').delete().eq('serie_id', t.serie_id);
        } else {
          return;
        }
      } else {
        await sb.from('transacoes').delete().eq('id', id);
      }

      await loadAll();
      renderApp();
    };
  });

  document.querySelectorAll('[data-edit-serie]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.editSerie;
      const t = state.transacoes.find(x => x.id === id);
      if (!t?.serie_id) return;

      const novoValorStr = prompt(`Novo valor para esta e as ocorrências futuras da série (a partir de ${fmtData(t.data)}):`, t.valor);
      if (novoValorStr === null) return;
      const novoValor = parseFloat(novoValorStr);
      if (!novoValor || novoValor <= 0) return;

      const { error } = await sb.from('transacoes')
        .update({ valor: novoValor })
        .eq('serie_id', t.serie_id)
        .gte('data', t.data);

      if (error) { alert(error.message); return; }

      await loadAll();
      renderApp();
    };
  });

  document.querySelectorAll('[data-del-cartao]').forEach(btn => {
    btn.onclick = async () => {
      await sb.from('cartoes').delete().eq('id', btn.dataset.delCartao);
      await loadAll();
      renderApp();
    };
  });

  document.querySelectorAll('[data-del-meta]').forEach(btn => {
    btn.onclick = async () => {
      await sb.from('metas').delete().eq('id', btn.dataset.delMeta);
      await loadAll();
      renderApp();
    };
  });

  document.querySelectorAll('[data-aporte-meta]').forEach(btn => {
    btn.onclick = async () => {
      const valorStr = prompt('Quanto você quer adicionar a essa meta?');
      const valor = parseFloat(valorStr);
      if (!valor || valor <= 0) return;
      const meta = state.metas.find(m => m.id === btn.dataset.aporteMeta);
      const novoValor = Number(meta.valor_atual || 0) + valor;
      await sb.from('metas').update({ valor_atual: novoValor }).eq('id', meta.id);
      await loadAll();
      renderApp();
    };
  });

  document.querySelectorAll('[data-def-orcamento]').forEach(btn => {
    btn.onclick = async () => {
      const categoriaId = btn.dataset.defOrcamento;
      const categoria = state.categorias.find(c => c.id === categoriaId);
      const atual = state.orcamentos.find(o => o.categoria_id === categoriaId);
      const valorStr = prompt(`Orçamento mensal para "${categoria?.nome}":`, atual ? String(atual.valor_limite) : '');
      if (valorStr === null) return;
      const valor = parseFloat(valorStr);
      if (!valor || valor <= 0) return;

      const { error } = await sb.from('orcamentos').upsert(
        { user_id: state.user.id, categoria_id: categoriaId, valor_limite: valor },
        { onConflict: 'user_id,categoria_id' }
      );
      if (error) { alert(error.message); return; }

      await loadAll();
      renderApp();
    };
  });

  document.getElementById('cat-salvar')?.addEventListener('click', async () => {
    const nome = document.getElementById('cat-nome').value.trim();
    const tipo = document.getElementById('cat-tipo').value;
    const erro = document.getElementById('cat-erro');

    if (!nome) {
      erro.textContent = 'Informe o nome da categoria.';
      erro.classList.remove('hidden');
      return;
    }

    const { error } = await sb.from('categorias').insert({
      user_id: state.user.id,
      nome,
      tipo,
    });

    if (error) {
      erro.textContent = error.message;
      erro.classList.remove('hidden');
      return;
    }

    await loadAll();
    renderApp();
  });

  document.querySelectorAll('[data-del-categoria]').forEach(btn => {
    btn.onclick = async () => {
      const categoria = state.categorias.find(c => c.id === btn.dataset.delCategoria);
      if (!confirm(`Excluir a categoria "${categoria?.nome}"? Isso só funciona se não houver transações usando ela.`)) return;
      const { error } = await sb.from('categorias').delete().eq('id', btn.dataset.delCategoria);
      if (error) { alert('Não foi possível excluir: ' + error.message); return; }
      await loadAll();
      renderApp();
    };
  });

  // ---- Nova transação ----
  if (state.view === 'nova-transacao') {
    let tipoSelecionado = 'entrada';
    let metodoSelecionado = 'Pix';

    const dataInput = document.getElementById('data');
    if (dataInput) {
      const hoje = new Date();
      dataInput.valueAsDate = ehMesAtual() ? hoje : state.mesRef;
    }

    const optEntrada = document.getElementById('opt-entrada');
    const optSaida = document.getElementById('opt-saida');
    const atualizarOptgroups = () => {
      if (!optEntrada || !optSaida) return;
      optEntrada.hidden = tipoSelecionado !== 'entrada';
      optSaida.hidden = tipoSelecionado !== 'saida';
    };
    atualizarOptgroups();

    document.querySelectorAll('.tipo-btn').forEach(btn => {
      btn.onclick = () => {
        tipoSelecionado = btn.dataset.tipo;
        document.querySelectorAll('.tipo-btn').forEach(b => {
          b.classList.remove('bg-aura-tint', 'text-aura-primary');
          b.classList.add('bg-white', 'text-aura-muted');
        });
        btn.classList.remove('bg-white', 'text-aura-muted');
        btn.classList.add('bg-aura-tint', 'text-aura-primary');
        document.getElementById('categoria').value = '';
        atualizarOptgroups();
      };
    });

    const blocoParcelas = document.getElementById('bloco-parcelas');
    const blocoRecorrente = document.getElementById('bloco-recorrente');
    const parcelasInput = document.getElementById('parcelas');
    const recorrenteCheckbox = document.getElementById('recorrente');
    const blocoRecorrenteMeses = document.getElementById('bloco-recorrente-meses');

    const atualizarVisibilidadeRecorrenteParcelas = () => {
      const numParcelas = parseInt(parcelasInput?.value) || 1;
      if (numParcelas > 1) {
        blocoRecorrente.classList.add('hidden');
        recorrenteCheckbox.checked = false;
        blocoRecorrenteMeses.classList.add('hidden');
      } else {
        blocoRecorrente.classList.remove('hidden');
      }
    };

    document.querySelectorAll('.metodo-btn').forEach(btn => {
      btn.onclick = () => {
        metodoSelecionado = btn.dataset.metodo;
        document.querySelectorAll('.metodo-btn').forEach(b => {
          b.classList.remove('bg-aura-tint', 'text-aura-primary');
          b.classList.add('bg-white', 'text-aura-muted');
        });
        btn.classList.remove('bg-white', 'text-aura-muted');
        btn.classList.add('bg-aura-tint', 'text-aura-primary');

        const cartaoSelect = document.getElementById('cartao-select');
        if (metodoSelecionado === 'Cartão') {
          cartaoSelect.classList.remove('hidden');
          blocoParcelas.classList.remove('hidden');
        } else {
          cartaoSelect.classList.add('hidden');
          cartaoSelect.value = '';
          blocoParcelas.classList.add('hidden');
          parcelasInput.value = 1;
        }
        atualizarVisibilidadeRecorrenteParcelas();
      };
    });

    parcelasInput?.addEventListener('input', atualizarVisibilidadeRecorrenteParcelas);

    recorrenteCheckbox?.addEventListener('change', () => {
      blocoRecorrenteMeses.classList.toggle('hidden', !recorrenteCheckbox.checked);
    });

    document.getElementById('salvar')?.addEventListener('click', async () => {
      const descricao = document.getElementById('descricao').value.trim();
      const valorTotal = parseFloat(document.getElementById('valor').value);
      const data = document.getElementById('data').value;
      const categoriaId = document.getElementById('categoria').value || null;
      const cartaoId = metodoSelecionado === 'Cartão' ? (document.getElementById('cartao-select').value || null) : null;
      const numParcelas = metodoSelecionado === 'Cartão' ? (parseInt(parcelasInput.value) || 1) : 1;
      const recorrente = recorrenteCheckbox.checked && numParcelas <= 1;
      const meses = recorrente ? (parseInt(document.getElementById('repetir-meses').value) || 12) : 1;
      const erro = document.getElementById('erro');

      if (!valorTotal || valorTotal <= 0 || !data) {
        erro.textContent = 'Preencha valor e data corretamente.';
        erro.classList.remove('hidden');
        return;
      }

      const base = {
        user_id: state.user.id,
        tipo: tipoSelecionado,
        categoria_id: categoriaId,
        metodo_pagamento: metodoSelecionado,
        cartao_id: cartaoId,
      };

      let linhas = [];
      const serieId = (numParcelas > 1 || recorrente) ? crypto.randomUUID() : null;

      if (numParcelas > 1) {
        const valorParcela = Math.round((valorTotal / numParcelas) * 100) / 100;
        const somaParcelas = valorParcela * (numParcelas - 1);
        for (let i = 0; i < numParcelas; i++) {
          linhas.push({
            ...base,
            descricao: `${descricao || 'Compra'} (${i + 1}/${numParcelas})`,
            valor: i === numParcelas - 1 ? Math.round((valorTotal - somaParcelas) * 100) / 100 : valorParcela,
            data: addMonths(data, i),
            parcela_atual: i + 1,
            total_parcelas: numParcelas,
            serie_id: serieId,
          });
        }
      } else if (recorrente) {
        for (let i = 0; i < meses; i++) {
          linhas.push({
            ...base,
            descricao,
            valor: valorTotal,
            data: addMonths(data, i),
            serie_id: serieId,
          });
        }
      } else {
        linhas.push({ ...base, descricao, valor: valorTotal, data });
      }

      const { error } = await sb.from('transacoes').insert(linhas);

      if (error) {
        erro.textContent = error.message;
        erro.classList.remove('hidden');
        return;
      }

      await loadAll();
      setView(state.previousView || 'inicio');
    });
  }

  // ---- Cartões ----
  document.getElementById('c-salvar')?.addEventListener('click', async () => {
    const nome = document.getElementById('c-nome').value.trim();
    const limite = parseFloat(document.getElementById('c-limite').value) || null;
    const fechamento = parseInt(document.getElementById('c-fechamento').value) || null;
    const vencimento = parseInt(document.getElementById('c-vencimento').value) || null;
    const erro = document.getElementById('c-erro');

    if (!nome) {
      erro.textContent = 'Informe o nome do cartão.';
      erro.classList.remove('hidden');
      return;
    }

    const { error } = state.editandoCartaoId
      ? await sb.from('cartoes').update({ nome, limite, dia_fechamento: fechamento, dia_vencimento: vencimento }).eq('id', state.editandoCartaoId)
      : await sb.from('cartoes').insert({
          user_id: state.user.id,
          nome,
          limite,
          dia_fechamento: fechamento,
          dia_vencimento: vencimento,
        });

    if (error) {
      erro.textContent = error.message;
      erro.classList.remove('hidden');
      return;
    }

    state.editandoCartaoId = null;
    await loadAll();
    renderApp();
  });

  // ---- Metas ----
  document.getElementById('m-salvar')?.addEventListener('click', async () => {
    const titulo = document.getElementById('m-titulo').value.trim();
    const valorAlvo = parseFloat(document.getElementById('m-valor').value);
    const prazo = document.getElementById('m-prazo').value || null;
    const erro = document.getElementById('m-erro');

    if (!titulo || !valorAlvo || valorAlvo <= 0) {
      erro.textContent = 'Informe título e valor alvo válidos.';
      erro.classList.remove('hidden');
      return;
    }

    const { error } = await sb.from('metas').insert({
      user_id: state.user.id,
      titulo,
      valor_alvo: valorAlvo,
      valor_atual: 0,
      prazo,
    });

    if (error) {
      erro.textContent = error.message;
      erro.classList.remove('hidden');
      return;
    }

    await loadAll();
    renderApp();
  });

  // ---- Investimentos ----
  document.getElementById('i-salvar')?.addEventListener('click', async () => {
    const ativo = document.getElementById('i-ativo').value.trim();
    const tipo = document.getElementById('i-tipo').value || null;
    const valorAplicado = parseFloat(document.getElementById('i-valor-aplicado').value);
    const valorAtualInput = document.getElementById('i-valor-atual').value;
    const valorAtual = valorAtualInput ? parseFloat(valorAtualInput) : valorAplicado;
    const data = document.getElementById('i-data').value || null;
    const erro = document.getElementById('i-erro');

    if (!ativo || !valorAplicado || valorAplicado <= 0) {
      erro.textContent = 'Informe o ativo e um valor aplicado válido.';
      erro.classList.remove('hidden');
      return;
    }

    const payload = {
      ativo,
      tipo,
      valor_aplicado: valorAplicado,
      valor_atual: valorAtual,
      data_aplicacao: data,
    };

    const { error } = state.editandoInvestimentoId
      ? await sb.from('investimentos').update(payload).eq('id', state.editandoInvestimentoId)
      : await sb.from('investimentos').insert({ user_id: state.user.id, ...payload });

    if (error) {
      erro.textContent = error.message;
      erro.classList.remove('hidden');
      return;
    }

    state.editandoInvestimentoId = null;
    await loadAll();
    renderApp();
  });

  document.querySelectorAll('[data-novo-invest]').forEach(btn => {
    btn.onclick = () => {
      state.editandoInvestimentoId = null;
      document.getElementById('form-invest')?.classList.toggle('hidden');
    };
  });

  document.querySelectorAll('[data-edit-invest]').forEach(btn => {
    btn.onclick = () => {
      state.editandoInvestimentoId = btn.dataset.editInvest;
      renderApp();
    };
  });

  document.querySelectorAll('[data-cancelar-edicao-invest]').forEach(btn => {
    btn.onclick = () => {
      state.editandoInvestimentoId = null;
      renderApp();
    };
  });

  document.querySelectorAll('[data-del-invest]').forEach(btn => {
    btn.onclick = async () => {
      await sb.from('investimentos').delete().eq('id', btn.dataset.delInvest);
      await loadAll();
      renderApp();
    };
  });
}

render();
</script>
</body>
</html>
